runtime:
  name: matcher
  id: matcher-1
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  grpc:
    addr: 0.0.0.0:9200
  http:
    addr: 0.0.0.0:9280
data:
  redis:
    addr: 127.0.0.1:16379
  nats:
    url: nats://127.0.0.1:14222
log:
  level: info
  format: text
  file: logs/matcher.log

# 可观测性：OTLP 链路导出端点（Tempo 的 gRPC 端口；空或不配 = noop 不导出）。
observability:
  otlp: 127.0.0.1:4317
