// matcher 服务配置：引用公共配置消息（撮合队列配置 M6 追加；成局处置参数 M7 追加）。
syntax = "proto3";

package matcher.conf;

option go_package = "github.com/huangyuCN/atlas-game-layout/services/matcher/internal/conf;conf";

import "protobuf/configs/runtime.proto";
import "protobuf/configs/registry.proto";
import "protobuf/configs/server.proto";
import "protobuf/configs/data.proto";
import "protobuf/configs/log.proto";
import "protobuf/configs/observability.proto";

// Matchmaker 是撮合运行参数（等待阈值 + 成局处置的有界扇出）。
// 所有字段的 0 / 缺省都表示「取代码缺省值」（见 internal/infra.DefaultRequestTimeout、
// internal/biz.DefaultAdmit*）——这些参数不存在「0 有意义」的取值，
// 尤其并发 0 **不是**无限并发（有界是硬约束）。
message Matchmaker {
  // request_timeout_ms 是单张票的最长等待时间（毫秒；缺省 30000）。
  // 到点后引擎产出 TicketTimedOut，matcher 按既有语义发 MATCH_FAIL_REASON_TIMEOUT
  // 失败事件——这是「超过阈值仍未成局」给玩家的确定性回执（不新增事件类型/协议字段）。
  int64 request_timeout_ms = 1;
  // admit_concurrency 是成局处置（开局+出票，一次跨进程 RPC）的并发上限（缺省 200）：
  // 拿不到并发槽的成局在各自的 ticket 监听里等待（背压），不会无界并发打向 battle。
  int32 admit_concurrency = 2;
  // admit_timeout_ms 是单局「开局+出票」的预算（毫秒；缺省 5000）：
  // 含 battle 侧懒激活冷启动的那一跳；超时即按失败处置（发失败事件 + 回池），不无限挂住。
  int64 admit_timeout_ms = 3;
  // admit_wait_ms 是拿不到并发槽时的等槽预算（毫秒；缺省 5000）：超时同样按失败处置。
  int64 admit_wait_ms = 4;
  // tick_interval_ms 是池扫描周期（毫秒；缺省 10）。
  // 50ms 时「每 tick 只成 1 局」把成局速率钉死在 20 局/秒 = 200 玩家/秒（诊断实测 19.95）；
  // 调到 10ms 即把成局上限按 tick 频率抬 5 倍。代价：tick 频率 ×N ⟹ 每 tick 固定的
  // 4 次 Redis 扫描往返/秒 ×N（matcher 全轮实测仅 0.067 核，CPU 仍可忽略），
  // 代价是共享 Redis 上的 QPS 上升——故本值可配，按池深度与 Redis 余量调。
  int64 tick_interval_ms = 5;
  // fetch_size 是每 tick 认领的候选上限（缺省 100；≤0 取缺省、>1000 夹到安全上限）。
  // 旧值 10 时每 tick 只认领 10 票 = 恰好 1 局（12288 实测 matches_per_tick 恒 1.000，
  // 成局速率 43.6 局/秒 × 10 人 ≈ 445 玩家/秒）；放大到 100 让「一轮循环成型」能成
  // 10 局（5v5）⟹ 上限 ≈4000 玩家/秒。上界口径：单 tick 认领 ≤fetch_size 张、
  // 服务端扫描 ≤4×fetch_size 次 GET——这是单 tick 内存与延迟的直接上界，
  // 故配冒进（>1000）会被夹到安全上限。
  int32 fetch_size = 6;
}

// BattlePlacement 是 matcher 选 battle 节点的策略：只影响「打到哪个节点」，
// 不改变 actor 归属规则（归属仍由 battle 侧目录 Claim 决定）。
enum BattlePlacement {
  // BATTLE_PLACEMENT_UNSPECIFIED 表示未配置：按 LOCAL_FIRST 处理（缺省即本机优先）。
  BATTLE_PLACEMENT_UNSPECIFIED = 0;
  // BATTLE_PLACEMENT_LOCAL_FIRST 表示同主机候选优先，本机一个都没有才跨机。
  BATTLE_PLACEMENT_LOCAL_FIRST = 1;
  // BATTLE_PLACEMENT_ANY 表示不区分主机（旧行为：负载均衡在全部候选里挑）。
  BATTLE_PLACEMENT_ANY = 2;
}

// Battle 是 matcher 访问 battle 域的选点与预热参数。
message Battle {
  // placement 是选点策略（缺省 = LOCAL_FIRST）。依据：同主机 ≈ 同故障域 + 最低时延，
  // 跨节点懒激活的冷启动（实测 p50≈2s）会摊到每次首调用上；本机不可用时仍跨机（不降级为不可用）。
  BattlePlacement placement = 1;
  // local_hosts 是「本机」主机白名单（主机名或 IP；空 = 由本进程网卡/主机名推导，
  // 见框架 selector/filter.LocalHosts）。仅 LOCAL_FIRST 使用。
  repeated string local_hosts = 2;
  // warmup 是「成局后、入场前」异步预热目标 battle actor 的开关（缺省 true）。
  // 用 proto3 optional 表达「未配置」：nil 取 true，显式 false 关闭。
  optional bool warmup = 3;
  // warmup_timeout_ms 是单次预热预算（毫秒；缺省 2000）。预热在独立 goroutine 内跑，
  // 超时只记日志与打点，不阻塞也不改变本局处置。
  int64 warmup_timeout_ms = 4;
}

message Bootstrap {
  atlas.configs.Runtime runtime = 1;
  atlas.configs.Registry registry = 2;
  atlas.configs.Server server = 3;
  atlas.configs.Data data = 4;
  atlas.configs.Log log = 5;
  // observability 是可观测性配置（OTLP 导出端点；空 = noop 不导出）。
  atlas.configs.Observability observability = 6;
  // matchmaker 是撮合运行参数（等待阈值与成局处置并发，见 Matchmaker 字段注释）。
  Matchmaker matchmaker = 7;
  // battle 是 battle 域的选点（本机优先）与预热参数（见 Battle 字段注释）。
  Battle battle = 8;
}
