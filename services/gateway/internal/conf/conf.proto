// gateway 服务配置：引用公共配置消息。
// 四协议接入参数在 atlas.configs.Server 的 tcp/websocket/kcp/udp 四节
// （不配该节 = 该协议不启用：不监听端口、不注册 handler）。
syntax = "proto3";

package gateway.conf;

option go_package = "github.com/huangyuCN/atlas-game-layout/services/gateway/internal/conf;conf";

import "protobuf/configs/runtime.proto";
import "protobuf/configs/registry.proto";
import "protobuf/configs/server.proto";
import "protobuf/configs/data.proto";
import "protobuf/configs/log.proto";
import "protobuf/configs/observability.proto";
import "protobuf/configs/session.proto";

message Bootstrap {
  atlas.configs.Runtime runtime = 1;
  atlas.configs.Registry registry = 2;
  atlas.configs.Server server = 3;
  atlas.configs.Data data = 4;
  atlas.configs.Log log = 5;
  // session 是会话租期（路由 TTL 与过期清扫周期；不配 = 默认 30s / ttl 的一半）。
  atlas.configs.Session session = 6;
  // observability 是可观测性配置（OTLP 导出端点；空 = noop 不导出）。
  atlas.configs.Observability observability = 14;
}
