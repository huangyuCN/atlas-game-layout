runtime:
  name: gateway
  # id 缺省取 <服务名>-<主机名>：注册实例 ID、actor NodeID 与指标 service_instance_id 三处同源，
  # 且必须每进程唯一（actor NodeID 决定 NATS 节点 subject atlas_actor.<env>.node.<id>.*，
  # 同主机的多个服务不得共用）；同主机同服务的双进程需在此显式配唯一 id。
  # version 缺省取构建注入版本（lib/version，Makefile/CI 经 -ldflags 写入）；需要时在此覆盖
  env: test        # 命名空间来源：链路资源 deployment.environment.name、注册中心键前缀 /atlas/services/<env>、
                   # actor 平面 NATS subject（atlas_actor.<env>.*）与业务 topic 前缀（atlas.<env>.push|event|gw.*）
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  http:
    addr: 0.0.0.0:10080
    timeout: 30s                  # 单次请求 handler 总执行时间（与 Atlas 默认 30s 相同，显式写出便于调整）
    # path_prefix: /api           # 路由前缀（不配 = 无前缀）
    # max_request_body: 1048576   # 请求体上限（字节，不配 = 1MB）
    # strict_slash: true          # 严格斜杠（不配 = Atlas 默认 true）
    # network: NETWORK_TCP4       # 网络类型：NETWORK_TCP(缺省)/NETWORK_TCP4/NETWORK_TCP6/NETWORK_UNIX
    # tls:                        # TLS；不配 = 明文。字段见 protobuf/configs/server.proto
    #   enabled: true
    #   cert_file: configs/tls/server.crt
    #   key_file: configs/tls/server.key
    #   ca_file: configs/tls/ca.crt   # 配了即校验客户端证书（client_auth=true 时强制要求）
    #   client_auth: false
  # 四协议接入通道：不配该节 = 该协议不启用（不监听端口、不注册 handler），
  # 模板按部署形态只暴露需要的通道。除 addr 外的参数均为注释示例（不配 = 底层默认）。
  tcp:
    addr: 0.0.0.0:9001
    # no_delay: true              # 关闭 Nagle 算法（TCP_NODELAY）
    # read_buffer: 4096           # 读缓冲字节数
    # write_buffer: 4096          # 写缓冲字节数
    # keep_alive: 30s             # TCP keepalive 间隔
    # pool_size: 4096             # 读写缓冲池大小
    # idle_timeout: 60s           # 连接空闲超时（不配 = 不限）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
    # max_body_size: 1048576      # 单帧最大字节数
    # tls:                        # TLS 字段同 http.tls（Server.TLS 共用）
  websocket:
    addr: 0.0.0.0:9002
    # path: /ws                   # 挂载路径（不配 = "/"）
    # pool_size: 4096             # 读写缓冲池大小
    # read_buffer: 4096           # 读缓冲字节数（与 write_buffer 各自独立生效）
    # write_buffer: 4096
    # idle_timeout: 60s           # 连接空闲超时（不配 = 不限）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # read_limit: 1048576         # 单条消息读上限（字节）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
    # max_body_size: 1048576      # 单帧最大字节数
    # subprotocols: [atlas]       # 协商的子协议列表（不配 = 不限定）
    # tls:                        # TLS 字段同 http.tls（Server.TLS 共用）
  kcp:
    addr: 0.0.0.0:9003
    # fast_profile: true          # 低延迟预设（nodelay/interval/resend/nc）；显式参数优先
    # lan_profile: true           # 局域网预设；显式参数优先
    # block_crypt: 0123456789abcdef0123456789abcdef   # 加密口令（长度不足会启动失败）
    # fec_data_shards: 10         # FEC 数据分片（与 fec_parity_shards 必须成对）
    # fec_parity_shards: 3
    # window_snd: 128             # 发送窗口（与 window_rcv 必须成对）
    # window_rcv: 128
    # mtu: 1400                   # 最大传输单元（字节）
    # max_body_size: 1048576      # 单帧最大字节数
    # idle_timeout: 60s           # 连接空闲超时（不配 = 不限）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
  udp:
    addr: 0.0.0.0:9004
    # pool_size: 4096             # 读写缓冲池大小
    # read_buffer: 4096           # 单包读缓冲字节数
    # max_body_size: 1048576      # 单包最大字节数
    # idle_timeout: 60s           # 对端空闲超时（不配 = 不限）
    # max_peers: 10000            # 最大对端数（不配 = 不限）
# 会话租期：redis 路由 TTL + 心跳续租周期，同时决定心跳超时判定阈值
# （下调 = 断线发现更快，代价是 redis 心跳写更频繁）。
# 取值应 ≥ 客户端会话心跳周期的 3 倍（允许连丢两次仍不掉线）：模板集成客户端心跳 10s，
# 故 30s 合适；若客户端用 SDK 默认心跳（30s），请把 ttl 调到 ≥90s。
session:
  ttl: 30s
  # sweep_interval: 15s         # 过期会话清扫周期（不配 = ttl 的一半）
data:
  redis:
    # mode 缺省即 single（单点）；哨兵/集群形态与字段见 protobuf/configs/data.proto
    addrs:
      - 127.0.0.1:16379
  nats:
    url: nats://127.0.0.1:14222
log:
  level: info
  format: text
  file: logs/gateway.log
# 可观测性：OTLP 链路导出端点（必须带 scheme：grpc/grpcs/http/https；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
# 采样：sampler 缺省跟随父级、根 span 按 sample_ratio 抽取（sample_ratio 缺省 1.0）。
observability:
  otlp: grpc://127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9151
