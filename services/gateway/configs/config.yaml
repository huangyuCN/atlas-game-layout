runtime:
  name: gateway
  # id 缺省取 <服务名>-<主机名>：注册实例 ID、actor NodeID 与指标 service_instance_id 三处同源，
  # 且必须每进程唯一（actor NodeID 决定 NATS 节点 subject atlas_actor.<ns>.node.<id>.*，
  # 同主机的多个服务不得共用）；同主机同服务的双进程需在此显式配唯一 id。
  # version 缺省取构建注入版本（lib/version，Makefile/CI 经 -ldflags 写入）；需要时在此覆盖
  env: test        # **仅标签**：链路资源 deployment.environment.name 与指标 env 标签；
                   # 命名空间由 runtime.namespace 派生，env 不参与任何前缀派生。
  # namespace 是**唯一命名空间字段**：注册中心键前缀 /atlas/services/<ns>、actor subject 前缀
  # atlas_actor.<ns>、业务 topic 前缀 atlas.<ns>、redis 键前缀 atlas:<ns>:、etcd 目录 /atlas/actors/<ns>
  # 五面全由它派生（框架 namespace.Derive）。**必须显式配置，缺失即启动失败**（严格模式 R9）；
  # 取值限 [A-Za-z0-9_-]，非法字符同样启动失败。缺省约定与五面派生表见 docs/config.md。
  namespace: test
  # 客户端版本门槛（M1 协议演进 + 阶段 3 战斗帧直连）：登录入口在网关，故该字段只在网关生效。
  #   空   = 仅记录（记录客户端上报版本，不拒绝）——未设门槛的部署行为不变；
  #   非空 = **登录期强制**：低于该版本 / 未上报 / 版本串非法一律拒绝（reason
  #          CLIENT_VERSION_TOO_LOW，message 提示需要升级到的最低版本），在**会话建立之前**判定：
  #          不建立会话、不进入匹配（被拒客户端后续业务 op 因无会话身份被拒）。
  # 需要灰度只记录时显式配 min_client_version_mode: MIN_CLIENT_VERSION_MODE_NEGOTIATE（逃生门）；
  # 缺省（含 OFF）与 ENFORCE 同义——「设置门槛即强制」，漏配 mode 不会静默退化成只记录。
  # 取值 = 首个支持「战斗帧直连」的 SDK 版本（阶段 3 起战斗帧不再经网关，老客户端会
  # 「匹配成功但连不上」）。模板示例 0.1.0 只拒绝不报版本与 0.0.x 的旧客户端，不误伤在用 SDK；
  # 三 SDK 直连版本发布并确认覆盖后上调（如 0.7.0），且必须先发 SDK 再上调，
  # 否则在用客户端会被一并拒绝（发布顺序见变更手册）。
  min_client_version: 0.1.0
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  # gRPC 是**两个互相独立的面**（缺省约定见 docs/config.md：地址为空 = 该面不启用）。
  # 注意区分方向：网关**自身**的两个面只服务"别人调网关"，而业务 op 是网关**作为客户端**
  # 拨号域服务的面——客户端 op 走域的 edge 面（grpc-edge 端点），会话联动走域的 internal 面。
  #   edge_addr（不可信区）：网关自身暂不注册域服务（客户端 op 走下面四协议通道，再由网关
  #     按路由表经 gRPC 转发到域 rpc/ 平面的 Edge 接口），只保留面本身与 opgrpc 拦截器，
  #     供后续网关侧 gRPC 接入使用；
  #   internal_addr（可信区）：服务间 gRPC + 管理面 AdminService——本轮**留空 = 不启用**。
  # 端口取 10081：10080 已被上面的 http 健康面占用（两面地址相同会被装配期拒绝）。
  grpc:
    edge_addr: 0.0.0.0:10081
    # internal_addr: 0.0.0.0:10082   # 留空 = 不启用 internal 面（P7 管理面再启用）
    timeout: 30s                  # 单次 RPC 超时；Atlas 默认 1s，本模板显式放宽到 30s
    reflection: true              # 调试/测试开启；生产应关闭（会暴露服务清单，两面同享该开关）
  http:
    addr: 0.0.0.0:10080
    timeout: 30s                  # 单次请求 handler 总执行时间（与 Atlas 默认 30s 相同，显式写出便于调整）
    # path_prefix: /api           # 路由前缀（不配 = 无前缀）
    # max_request_body: 1048576   # 请求体上限（字节，不配 = 1MB）
    # strict_slash: true          # 严格斜杠（不配 = Atlas 默认 true）
    # network: NETWORK_TCP4       # 网络类型：NETWORK_TCP(缺省)/NETWORK_TCP4/NETWORK_TCP6/NETWORK_UNIX
    # tls:                        # TLS；不配 = 明文。字段见 protobuf/configs/server.proto
    #   enabled: true
    #   cert_file: configs/tls/server.crt
    #   key_file: configs/tls/server.key
    #   ca_file: configs/tls/ca.crt   # 配了即校验客户端证书（client_auth=true 时强制要求）
    #   client_auth: false
  # 业务协议接入通道（tcp/websocket）：节点缺失或 addr 为空 = 该协议不启用
  # （不监听端口、不注册 handler），模板按部署形态只暴露需要的通道。
  # 除 addr 外的参数均为注释示例（空 = 不覆盖底层默认；缺省约定唯一规则见 docs/config.md）。
  tcp:
    addr: 0.0.0.0:9001
    # no_delay: true              # 关闭 Nagle 算法（TCP_NODELAY）
    # read_buffer: 4096           # 读缓冲字节数
    # write_buffer: 4096          # 写缓冲字节数
    # keep_alive: 30s             # TCP keepalive 间隔
    # pool_size: 4096             # 读写缓冲池大小
    # idle_timeout: 60s           # 连接空闲超时（不配 = 不限）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
    # max_body_size: 1048576      # 单帧最大字节数
    # tls:                        # TLS 字段同 http.tls（Server.TLS 共用）
  websocket:
    addr: 0.0.0.0:9002
    # path: /ws                   # 挂载路径（不配 = "/"）
    # pool_size: 4096             # 读写缓冲池大小
    # read_buffer: 4096           # 读缓冲字节数（与 write_buffer 各自独立生效）
    # write_buffer: 4096
    # idle_timeout: 60s           # 连接空闲超时（不配 = 不限）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # read_limit: 1048576         # 单条消息读上限（字节）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
    # max_body_size: 1048576      # 单帧最大字节数
    # subprotocols: [atlas]       # 协商的子协议列表（不配 = 不限定）
    # tls:                        # TLS 字段同 http.tls（Server.TLS 共用）
  # 战斗帧面（kcp/udp）不在此服务：阶段 3 批次 5 起客户端凭 battle_ticket 直连
  # **接入层**（services/edge，端口 7100/7101/7102）→ battle 帧面（9401/9402/9403）。
  # 网关不再监听 KCP/UDP，也不再承载任何战斗 op（经网关发战斗 op 明确失败：
  # 帧引擎层 TRANSPORT_NOT_FOUND，不是静默丢弃）。
# 会话租期：redis 路由 TTL + 心跳续租周期，同时决定心跳超时判定阈值
# （下调 = 断线发现更快，代价是 redis 心跳写更频繁）。
# 取值应 ≥ 客户端会话心跳周期的 3 倍（允许连丢两次仍不掉线）：模板集成客户端心跳 10s，
# 故 30s 合适；若客户端用 SDK 默认心跳（30s），请把 ttl 调到 ≥90s。
session:
  ttl: 30s
  # sweep_interval: 15s         # 过期会话清扫周期（不配 = ttl 的一半）
data:
  redis:
    # mode 缺省即 single（单点）；哨兵/集群形态与字段见 protobuf/configs/data.proto
    addrs:
      - 127.0.0.1:16379
  nats:
    url: nats://127.0.0.1:14222
log:
  level: info
  format: text
  file: logs/gateway.log
# 可观测性：OTLP 链路导出端点（必须带 scheme：grpc/grpcs/http/https；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
# 采样：sampler 缺省跟随父级、根 span 按 sample_ratio 抽取（sample_ratio 缺省 1.0）。
observability:
  otlp: grpc://127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9151
