runtime:
  name: gateway
  id: gateway-1
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  http:
    addr: 0.0.0.0:10080
data:
  redis:
    addr: 127.0.0.1:16379
  nats:
    url: nats://127.0.0.1:14222
log:
  level: info
  format: text
  file: logs/gateway.log
# 业务四协议按需启用：删除对应节即裁掉该协议（不监听端口、不注册 handler），
# 模板按部署形态只暴露需要的通道。
tcp:
  addr: 0.0.0.0:9001
websocket:
  addr: 0.0.0.0:9002
kcp:
  addr: 0.0.0.0:9003
udp:
  addr: 0.0.0.0:9004

# 可观测性：OTLP 链路导出端点（Tempo 的 gRPC 端口；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
observability:
  otlp: 127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9151
