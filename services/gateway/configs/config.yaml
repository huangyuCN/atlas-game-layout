# gateway 配置：五协议接入 + 会话与路由
name: gateway
id: gateway-1
http:
  addr: 0.0.0.0:10080
tcp:
  addr: 0.0.0.0:9001
websocket:
  addr: 0.0.0.0:9002
kcp:
  addr: 0.0.0.0:9003
udp:
  addr: 0.0.0.0:9004
etcd:
  endpoints:
    - 127.0.0.1:12379
redis:
  addr: 127.0.0.1:16379
nats:
  url: nats://127.0.0.1:14222
log:
  level: info
