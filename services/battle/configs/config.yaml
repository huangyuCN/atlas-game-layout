runtime:
  name: battle
  id: battle-1
  version: 0.1.0   # 进链路资源 service.version（Grafana 按版本区分）
  env: test        # 进链路资源 deployment.environment.name
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  grpc:
    addr: 0.0.0.0:9300
  http:
    addr: 0.0.0.0:9380
data:
  nats:
    url: nats://127.0.0.1:14222
  mongo:
    uri: mongodb://127.0.0.1:27017
    database: battle
log:
  level: info
  format: text
  file: logs/battle.log

# 可观测性：OTLP 链路导出端点（必须带 scheme：grpc/grpcs/http/https；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
# 采样：sampler 缺省跟随父级、根 span 按 sample_ratio 抽取（sample_ratio 缺省 1.0）。
observability:
  otlp: grpc://127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9153
