runtime:
  name: battle
  # id 缺省取 <服务名>-<主机名>：注册实例 ID、actor NodeID 与指标 service_instance_id 三处同源，
  # 且必须每进程唯一（actor NodeID 决定 NATS 节点 subject atlas_actor.<ns>.node.<id>.*，
  # 同主机的多个服务不得共用）；同主机同服务的双进程需在此显式配唯一 id。
  # version 缺省取构建注入版本（lib/version，Makefile/CI 经 -ldflags 写入）；需要时在此覆盖
  env: test        # **仅标签**：链路资源 deployment.environment.name 与指标 env 标签；
                   # 命名空间由 runtime.namespace 派生，env 不参与任何前缀派生。
  # namespace 是**唯一命名空间字段**：注册中心键前缀 /atlas/services/<ns>、actor subject 前缀
  # atlas_actor.<ns>、业务 topic 前缀 atlas.<ns>、redis 键前缀 atlas:<ns>:、etcd 目录 /atlas/actors/<ns>
  # 五面全由它派生（框架 namespace.Derive）。**必须显式配置，缺失即启动失败**（严格模式 R9）；
  # 取值限 [A-Za-z0-9_-]，非法字符同样启动失败。缺省约定与五面派生表见 docs/config.md。
  namespace: test
  # 客户端版本门槛（M1 协议演进）字段位：校验逻辑在**网关登录入口**（见 p3 的版本门槛实现），
  # 本服务声明仅为「每服务一份自包含 YAML」的样例；OFF=不校验；NEGOTIATE=只协商；ENFORCE=拒绝低版本。
  min_client_version: 0.1.0
  min_client_version_mode: MIN_CLIENT_VERSION_MODE_NEGOTIATE
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  # gRPC 是**两个互相独立的面**（缺省约定见 docs/config.md：地址为空 = 该面不启用）：
  #   edge_addr（不可信区）：**本项目不启用**——阶段 3 批次 5 起客户端战斗 op 不经网关，
  #     而是凭 battle_ticket 直连接入层 → 本服务的 KCP/UDP/WS 帧面（见下方 server.kcp/udp/websocket）；
  #     故 Edge gRPC 面不再监听（配了就白开一个没人调的可信边界缺口）。
  #   internal_addr（可信区）：服务间 gRPC 调用（matcher 开局/取票、game 结算联动）+ P7 管理面 AdminService。
  # 地址为空 = 该面不启用；两面都挂 opgrpc 一元拦截器（入站 metadata→ctx 身份、出站错误→gRPC status）。
  grpc:
    internal_addr: 0.0.0.0:9301
    timeout: 30s                  # 单次 RPC 超时；Atlas 默认 1s，本模板显式放宽到 30s
    reflection: true              # 调试/测试开启；生产应关闭（会暴露服务清单，两面同享该开关）
    # stream_timeout: 30s         # 流式 RPC 超时（不配 = 不限）
    # max_recv_msg_size: 4194304  # 单条消息接收上限（字节，不配 = 4MB）
    # metadata: true              # 注册 gRPC metadata 服务
    # admin: true                 # 注册 gRPC admin（channelz）服务
    # network: NETWORK_TCP4       # 网络类型：NETWORK_TCP(缺省)/NETWORK_TCP4/NETWORK_TCP6/NETWORK_UNIX
    # tls:                        # TLS；不配 = 明文。字段见 protobuf/configs/server.proto
    #   enabled: true
    #   cert_file: configs/tls/server.crt
    #   key_file: configs/tls/server.key
    #   ca_file: configs/tls/ca.crt   # 配了即校验客户端证书（client_auth=true 时强制要求）
    #   client_auth: false
  http:
    addr: 0.0.0.0:9380
    timeout: 30s                  # 单次请求 handler 总执行时间（与 Atlas 默认 30s 相同，显式写出便于调整）
    # path_prefix: /api           # 路由前缀（不配 = 无前缀）
    # max_request_body: 1048576   # 请求体上限（字节，不配 = 1MB）
    # strict_slash: true          # 严格斜杠（不配 = Atlas 默认 true）
    # network: NETWORK_TCP4       # 网络类型：NETWORK_TCP(缺省)/NETWORK_TCP4/NETWORK_TCP6/NETWORK_UNIX
    # tls:                        # TLS；不配 = 明文。字段见 protobuf/configs/server.proto
    #   enabled: true
    #   cert_file: configs/tls/server.crt
    #   key_file: configs/tls/server.key
    #   ca_file: configs/tls/ca.crt   # 配了即校验客户端证书（client_auth=true 时强制要求）
    #   client_auth: false
  # 直连帧面（阶段 3 批次 2）：battle 的 KCP/UDP/WS 三个客户端直连监听——成局后客户端凭
  # battle_ticket 直连进来，战斗帧不再经过网关（规格 §1.2 裁定 5）。节点缺失或 addr 为空
  # = 该帧面不启用（不监听端口、不注册帧 op）；接入层按服务名 battle-frame 的实例元数据
  # 发现这些端口（批次 3），故端口不写死、不进票据。
  # 除 addr 外的参数均为注释示例（空 = 不覆盖底层默认；缺省约定见 docs/config.md）。
  kcp:
    addr: 0.0.0.0:9401
    # fast_profile: true          # 低延迟预设（nodelay/interval/resend/nc）；显式参数优先
    # lan_profile: true           # 局域网预设；显式参数优先
    # block_crypt: 0123456789abcdef0123456789abcdef   # 加密口令（长度不足会启动失败）
    # fec_data_shards: 10         # FEC 数据分片（与 fec_parity_shards 必须成对）
    # fec_parity_shards: 3
    # window_snd: 128             # 发送窗口（与 window_rcv 必须成对）
    # window_rcv: 128
    # mtu: 1400                   # 最大传输单元（字节）
    # max_body_size: 16368        # 单帧 body 上限（字节）。**单包 ≤16 KiB 契约**：接入层回程按
                                  # 整个数据报计 16 KiB（超出的数据报被丢弃），故 body 上限 =
                                  # 16 KiB − 帧头 16B = 16368；不配 = 本服务按契约补该值，
                                  # 显式配置超过它即启动失败（配大了不会生效）。
                                  # 超包回执不会下发给引擎（引擎静默丢弃）：帧面改回
                                  # TRANSPORT_DOWNLINK_FAILED 并计 battle_frame_reply_oversize_total，
                                  # 客户端应缩小请求区间（如 SyncFrames 的 last_seen_frame）后重试。
    # idle_timeout: 120s          # 连接空闲超时（本服务**不配即取 battle.offline_timeout/3**，
                                  # 见下方 offline_timeout；显式配置必须小于它，否则启动失败）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
  udp:
    addr: 0.0.0.0:9402
    # pool_size: 4096             # 读写缓冲池大小
    # read_buffer: 4096           # 单包读缓冲字节数
    # max_body_size: 16368        # 单包 body 上限（字节）；口径同 server.kcp.max_body_size：
                                  # 不配 = 按「单包 ≤16 KiB」契约补 16368，配大了启动失败。
    # idle_timeout: 120s          # 对端空闲超时（本服务**不配即取 battle.offline_timeout/3**，
                                  # 见下方 offline_timeout；显式配置必须小于它，否则启动失败）
    # max_peers: 10000            # 最大对端数（不配 = 不限）
  websocket:
    addr: 0.0.0.0:9403
    # path: /ws                   # 挂载路径（不配 = "/"）
    # pool_size: 4096             # 读写缓冲池大小
    # read_buffer: 4096           # 读缓冲字节数（与 write_buffer 各自独立生效）
    # write_buffer: 4096
    # idle_timeout: 120s          # 连接空闲超时（不配 = 底层默认 120s；**本服务不改写**：
                                  # WS/TCP 有可靠 EOF，对端断开即时可见，不靠空闲超时发现掉线）
    # write_timeout: 10s          # 单次写超时（不配 = 不限）
    # read_limit: 1048576         # 单条消息读上限（字节）
    # max_conns: 10000            # 最大并发连接数（不配 = 不限）
    # max_body_size: 16368        # 单帧 body 上限（字节）；口径同 server.kcp.max_body_size
                                  # （WS 走 TCP 不分片，但超包回执在接入层同样发不出去）。
    # subprotocols: [atlas]       # 协商的子协议列表（不配 = 不限定）
    # tls:                        # TLS 字段同 http.tls（Server.TLS 共用）

data:
  nats:
    url: nats://127.0.0.1:14222
  mongo:
    uri: mongodb://127.0.0.1:27017
    database: battle
log:
  level: info
  format: text
  file: logs/battle.log

# 直连出票配置（阶段 3 批次 2）：battle 与接入层共持同一把票据密钥。
battle:
  # ticket_key 是入场票据的 AEAD 密钥（base64 的 32 字节）；**缺失/长度不符即启动失败**
  #（不提供默认值）。生产经配置中心注入，且必须与 services/edge 的 edge.ticket_key 同值；
  # 下面这串仅供本地开发（字节 0x01..0x20）。
  ticket_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
  # ticket_ttl 是票据有效期（time.ParseDuration 字符串；空 = 120s，必须为正）。
  # 应大于掉线重连窗口（offline_timeout，默认 15s）：窗口内重连可复用同一张票。
  ticket_ttl: 120s
  # offline_timeout 是掉线判定窗口（阶段 3 批次 6，规格 §9.2；time.ParseDuration 字符串，
  # 空 = 15s；必须为正，显式 0 表示关闭掉线判定）。**数据报面没有关闭握手**：KCP/UDP 的掉线
  # 只能靠帧面空闲读超时发现，故 server.kcp/server.udp 的 idle_timeout 缺省取它的 1/3
  #（15s → 5s）；显式配置的 idle_timeout 必须严格小于本值，否则装配期直接启动失败。
  # 客户端需在窗口内回座（同票重连），否则判负并移出参战名单（只剩一人即判胜结算）。
  # **客户端须以 ≤ offline_timeout/3 的周期发送帧或 Ping 保活**（缺省 15s → 5s；无输入期间
  # 就用 battle.v1.BattleService/Ping：Tell 无回执、不改对局状态），否则会被判掉线（数据报面）
  # 且 NAT 映射可能失效（此后下行帧收不到，表现为「连接还在但没数据」）。
  offline_timeout: 15s
  # max_frames / tick_interval_ms 是**局时长两件**（阶段 3 批次 C）：单局寿命 = 帧数上限 × 帧间隔。
  # 两者**整项不配置即取现值**（60 帧 × 100ms ≈ 6s）——不配行为零变化；显式值必须为正且不超
  # 上限（max_frames ≤ 20000、tick_interval_ms ≤ 1000），显式 0/负值/超上限一律**启动失败**
  #（未配置与显式 0 语义不同：前者取缺省，后者是笔误）。上限依据与长局验收见 docs/config.md §7.6。
  # 调大之后的连带约束：局变长不等于可以不保活——数据报面（KCP/UDP）仍按空闲读超时判活，
  # 客户端必须以 ≤ offline_timeout/3 的周期发帧或 Ping（见上方 offline_timeout 注释）。
  # max_frames: 300             # 帧数上限（缺省 60；300 × 100ms = 30s 一局，长局验收口径）
  # tick_interval_ms: 100       # 帧间隔（毫秒整数，缺省 100；与 max_frames 共同决定单局寿命）
  # edge_endpoints 是接入层「传输面 → 地址」列表（随成局推送下发给客户端，全局唯一来源）：
  # 客户端凭这些地址连**接入层**（不是 battle 自己的帧端口 9401/9402/9403——那是接入层拨的后端，
  # 由 battle 注册的 battle-frame 实例元数据给出）。必须按面下发：接入层分面监听
  # （ws=tcp:7100、kcp=udp:7101、udp=udp:7102），单地址无法让 SDK 知道该拨哪个端口。
  # 装配期校验**至少一面、面不重复、地址非空**，违反即启动失败；**不要求三面齐全**——
  # 只开 ws 的部署也能启动，缺面只影响用该面的客户端（SDK 缺面即报错）。
  # 实例主机由下面的 frame_advertise_host 决定（未配时才回落到本列表的主机）。
  edge_endpoints:
    - transport: EDGE_TRANSPORT_WS  # WebSocket 面（TCP 承载）
      address: "10.10.9.36:7100"
    - transport: EDGE_TRANSPORT_KCP # KCP 面（可靠 UDP）
      address: "10.10.9.36:7101"
    - transport: EDGE_TRANSPORT_UDP # 裸 UDP 面
      address: "10.10.9.36:7102"
  # frame_advertise_host 是**本节点帧端口对外的可达主机**——接入层从哪个主机能拨到本节点的
  # ws/kcp/udp 帧端口。**注意与 edge_endpoints 语义不同**：后者是给**客户端**拨的接入层地址，
  # 本项是给**接入层**拨的 battle 主机。三条语义：
  #   1) 显式配置：只填主机部分（不含端口，如 10.10.9.36 或 battle-1.internal）；帧端口仍取
  #      帧面服务端**已绑定**的真实端口。配了空白串、host:port（带端口）或带方括号的 IPv6
  #      一律启动失败——不静默截断、不静默回落（「配了没生效」比启动失败更贵）。
  #   2) 不配（整项缺失）：回落到 edge_endpoints 的主机——**该回落仅适合同机部署**
  #      （接入层与 battle 跑在同一主机）。
  #   3) 跨机部署**必须显式配置**：否则注册出去的端点会指向接入层主机，接入层会拿自己的地址
  #      去拨后端（表现为连不上后端，且极难定位）。
  frame_advertise_host: "10.10.9.36"

# 可观测性：OTLP 链路导出端点（必须带 scheme：grpc/grpcs/http/https；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
# 采样：sampler 缺省跟随父级、根 span 按 sample_ratio 抽取（sample_ratio 缺省 1.0）。
observability:
  otlp: grpc://127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9153
