// battle 服务配置：引用公共配置消息（含 mongo 战斗结果存储）。
syntax = "proto3";

package battle.conf;

option go_package = "github.com/huangyuCN/atlas-game-layout/services/battle/internal/conf;conf";

import "api/battle/v1/battle_service.proto";
import "protobuf/configs/runtime.proto";
import "protobuf/configs/registry.proto";
import "protobuf/configs/server.proto";
import "protobuf/configs/data.proto";
import "protobuf/configs/log.proto";
import "protobuf/configs/observability.proto";
import "protobuf/configs/actor.proto";

// BattleConf 是战斗域直连出票配置（阶段 3 批次 2）：
// 入场票据的 AEAD 密钥与接入层各面地址，两者都由 battle 侧装配期校验。
message BattleConf {
  // ticket_key 是入场票据密钥（base64 编码的 32 字节；接入层 edge.ticket_key 必须同值）：
  // 缺失、base64 非法或长度不符即启动失败——不提供默认值。
  string ticket_key = 1;
  // ticket_ttl 是票据有效期（time.ParseDuration 字符串，如 120s；空 = 120s；
  // 必须为正）。应大于掉线重连窗口，窗口内重连可复用同一张票。
  string ticket_ttl = 2;
  // edge_endpoints 是接入层「传输面 → 地址」列表（随成局推送下发给客户端，
  // 全局唯一来源）：装配期校验**至少一面、面不重复、地址非空**，违反即启动失败。
  // 复用 battle.v1.EdgeEndpoint（不另定义同形消息）：配置与契约共用同一套面枚举，
  // 避免两处词表漂移。**不要求三面齐全**——只开 ws 的部署也能启动，缺面只影响用该面的客户端。
  repeated battle.v1.EdgeEndpoint edge_endpoints = 3;
  // frame_advertise_host 是**本节点帧端口对外的可达主机**——接入层从哪个主机能拨到本节点的
  // ws/kcp/udp 帧端口（与 edge_endpoints 的语义不同：后者是**给客户端拨的接入层地址**）。
  // 帧端口不在这里：端口取帧面服务端已绑定的真实地址。
  //   - 不配（字段缺失）：回落到 edge_endpoints 的主机——**该回落仅适合同机部署**
  //     （接入层与 battle 同一主机）；跨机部署必须显式配置，否则注册出去的端点会指向
  //     接入层主机，接入层会拿自己的地址去拨后端（表现为连不上后端，且极难定位）；
  //   - 显式配置：必须是非空、**不含端口**的主机部分（如 10.10.9.36 或 battle.internal）；
  //     配了空串、纯空白或形如 host:port 的值一律装配期报错（不静默截断或回落）。
  optional string frame_advertise_host = 4;
  // offline_timeout 是掉线判定窗口（time.ParseDuration 字符串，如 15s；空 = 15s；必须为正；
  // 0 或负值 = 关闭掉线判定，仅测试/特例使用）。
  // 数据报面（KCP/UDP）没有关闭握手，掉线只能靠帧面的空闲读超时发现，故其 idle_timeout
  // 缺省取本值的 1/3（缺省 15s → 5s）；装配期校验「数据报面 idle < offline_timeout」，
  // 不满足即启动失败（否则掉线事件会迟到缺省的 120s，本策略形同虚设）。
  string offline_timeout = 5;
  // max_frames 是单局帧数上限（正数；**不配置 = 6000**，即 10fps 下 10 分钟一局）。
  // 为什么是 6000 而不是 60：真实对局时长 5–15 分钟 ⇒ 3000–9000 帧，6000 取区间中位；
  // 旧缺省 60 只够 6 秒（60 × 100ms），对局刚开打就结算，压测/联调时端上看到的全是
  // 「对局已结束」，会被误判为**对局异常结束**（几轮数据因此作废）。这个数字有口径，
  // 不是随手挑的，调整前先确认对局时长口径。
  // 与 tick_interval_ms 共同决定单局寿命（帧数上限 × 帧间隔）；到达上限即由模拟器判出
  // 位置领先者胜并走既有结算路径，故它同时是「一局最多持续多久」的唯一开关。
  // 校验：>0 且 ≤ MaxFramesLimit（20000）；显式 0/负值/超上限一律启动失败——**未配置与
  // 显式 0 必须区分**（前者取缺省 6000，后者是笔误），故用 optional 而非裸标量。
  // 上限 20000 的依据（内存/快照成本，见 services/battle/internal/actor）：
  // 帧输入日志每帧每玩家一条 lockstep.Input（≈112B 含分配开销），快照每 SnapshotEvery
  // （缺省 10）帧一份（≈136B）；2 人局每帧 ≈238B，20000 帧 ≈4.8MiB/局（10fps 下 ≈33 分钟）。
  optional int64 max_frames = 6;
  // tick_interval_ms 是帧间隔（**毫秒整数**；不配置 = 100）。选毫秒整数而非
  // google.protobuf.Duration：本文件既有的两个时长字段（ticket_ttl / offline_timeout）
  // 都是「字符串 + time.ParseDuration」，仓内无任何 Duration 用法；毫秒整数与 server.proto
  // 的 int32/int64 数值风格一致，且免去 Duration 的秒/纳秒双字段误配。
  // 校验：>0 且 ≤ MaxTickIntervalMillis（1000）；显式 0/负值/超上限一律启动失败。
  // 上限 1000ms 的依据：① 帧同步语义——帧间隔 >1s 时客户端插值/预测窗口失效；
  // ② 与数据报面空闲读超时耦合——server.kcp/udp 的 idle_timeout 缺省取 offline_timeout/3
  //（缺省 15s → 5s），帧间隔 1s 时尚有 5 帧余量，再大则丢一两个包就可能被空闲超时误判掉线。
  optional int64 tick_interval_ms = 7;
  // seat_window_ms 是成局后的**入座窗口**（毫秒整数）：成局（出票）后对局时钟不推进，
  // 等全部参战者的帧连接建立（入座）或窗口到期再开打——把「客户端还没到场」的时间
  // 从对局寿命里扣掉（旧行为成局即开打，晚到玩家拿到 BATTLE_ENDED）。
  //   - 不配置：缺省 3000ms（客户端建连+握手实测 1–2s，留一倍余量）；
  //   - 显式 0：**关闭窗口**（成局即开打，旧行为）；未配置与显式 0 必须区分，故用 optional；
  //   - 负值或 > 30000ms：启动失败（负数没有语义，超上限已不是「等入座」而是挂住对局）。
  // 到期仍有人未入座时：不再等待、立即开打；未入座者不剔除、不重配——他在对局结束前
  // 仍可加入并参与，迟到补投/拒绝仍是既有的 BATTLE_ENDED 语义（帧协议零改动）。
  optional int64 seat_window_ms = 8;
  // max_players 是每局会话容量上限（= 一个对局里的参战人数上限）：
  // 不配置 = 10（与 matcher 的 5v5 对齐——casual 规则集单侧上限 5，故一局最多 10 人）；
  // 校验：1–64，显式 0/负值/超上限一律启动失败（0 不是「不限」：那会让一个病态名单
  // 无限扩张会话，容量必须显式）。**小于实际成局人数会让多出来的玩家「进不去会话」**，
  // 故它与 matcher 的 MaxSide 必须一致或更大。
  optional int32 max_players = 9;
  // frame_broadcast_protobuf 是帧广播**载荷编码**的切换开关（不配置 = false = protojson/ver=1）：
  // 打开后帧广播按 protobuf 二进制（帧头 ver=2）下发，单帧体积约降到 1/3.5
  // （实测同一广播 1631 B → 465 B；ws 面 41k pps 下 ≈603 Mbps → ≈172 Mbps）。
  // **只改编码，不改任何消息字段，也不减少帧数**（每连接每 tick 仍是一次写）。
  //
  // 打开前必须确认**三端 SDK 都能解 ver=2 帧广播**（现状：Go 直连 SDK 的 OnFrame 与补帧基准
  // 写死 protojson；TS/C# 把 (payload, version) 原样交给上层，但补帧基准只认 ver=1）——
  // 未升级的客户端会静默丢弃帧广播（补帧进度也不推进）。客户端就绪前保持缺省即可零影响。
  bool frame_broadcast_protobuf = 10;
  // edge_instances 是接入层**实例列表**（多实例部署用；每实例一组「传输面 → 地址」）：
  // 出票时按 player_id 哈希从列表里选一个实例下发给该玩家，**同一玩家恒定同一实例**
  // （数据报面的 flow 状态因此不跨实例漂移；换实例不改票、不改签名）。
  //   - 列表只有一个元素时行为与单实例完全相同（等价于 edge_endpoints 简写）；
  //   - 与 edge_endpoints **互斥**（两者都配即启动失败，避免地址来源二义）；
  //   - 每个实例至少一面、面不重复、地址非空（与 edge_endpoints 同一套校验）。
  repeated EdgeInstance edge_instances = 11;
  // datagram_idle_timeout 是数据报面（KCP/UDP）的**空闲读超时**（time.ParseDuration 字符串，
  // 如 30s）：它决定「连接静默多久后 battle 关闭该帧会话」，与 offline_timeout 解耦。
  //   - 不配置 / 显式 0s：沿用 offline_timeout/3（缺省 15s → 5s，现行为零变化）；
  //   - 显式值：必须落在 [1s, 600s]（低于 1s 属于笔误；600s 已是「掉线连接占住会话」的顶），
  //     **允许 ≥ offline_timeout**——无感切网（断流后客户端换源端口、接入层接管）要求
  //     `datagram_idle_timeout ≥ 最长断流时间`，否则 battle 会在断流期间先关掉会话，
  //     之后接入层接管只是换了接入层这一段，battle 侧已无会话可续。
  // 取舍：该值越大，掉线连接占用帧会话/座位的越久（判负要等到 idle 超时 + offline_timeout）；
  // 与 offline_timeout 的配套口径见 docs/config.md §7.3。
  string datagram_idle_timeout = 12;
  // max_network_gap 是「玩家最多断网多久还能回来」的**唯一业务配置**（time.ParseDuration
  // 字符串，如 30s）：面向开发者的语义只有这一句，配了它就**不用再管** offline_timeout 与
  // datagram_idle_timeout——两者由它自动推导：
  //   - datagram_idle_timeout = max_network_gap（会话至少活这么久，断流中不先拆会话）；
  //   - offline_timeout = max_network_gap × 1.5（判负晚于拆会话，给回座留出余量）。
  //   - 不配置 / 显式 0s：**不启用**（保持两项各自的现有行为，零破坏）；
  //   - 显式值：必须落在 [1s, 300s]；与 offline_timeout 或 datagram_idle_timeout 同时配置
  //     即启动失败（二义：要么用 max_network_gap，要么用那两项）。
  // 客户端侧：该值随出票回执 → 成局事件 → MatchStartedNotify.max_network_gap_ms 下发，
  // 客户端据此设置自己的空闲判定，不必再单独配置；显式设置的 SDK 选项仍优先（逃生阀）。
  string max_network_gap = 13;
}

// EdgeInstance 是一个接入层实例（多实例部署时按玩家哈希选其一）。
message EdgeInstance {
  // name 是实例标识（只进日志/排障，不下发给客户端，不参与选择；可空）。
  string name = 1;
  // endpoints 是该实例的各传输面地址（至少一面、面不重复、地址非空）。
  repeated battle.v1.EdgeEndpoint endpoints = 2;
}

message Bootstrap {
  atlas.configs.Runtime runtime = 1;
  atlas.configs.Registry registry = 2;
  atlas.configs.Server server = 3;
  atlas.configs.Data data = 4;
  atlas.configs.Log log = 5;
  // observability 是可观测性配置（OTLP 导出端点；空 = noop 不导出）。
  atlas.configs.Observability observability = 6;
  // battle 是直连出票配置（批次 2 起必填：缺段/缺密钥即启动失败）。
  BattleConf battle = 7;
  // actor 是 actor 集群租约（归属键 TTL 与续租周期；两项空 = 缺省 60s/20s）。
  // 缺省约定与取舍见 docs/config.md §10；非法组合（Renew ≥ TTL）即启动失败。
  atlas.configs.Actor actor = 8;
}
