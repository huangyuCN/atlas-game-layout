// battle 服务配置：引用公共配置消息（含 mongo 战斗结果存储）。
syntax = "proto3";

package battle.conf;

option go_package = "github.com/huangyuCN/atlas-game-layout/services/battle/internal/conf;conf";

import "api/battle/v1/battle_service.proto";
import "protobuf/configs/runtime.proto";
import "protobuf/configs/registry.proto";
import "protobuf/configs/server.proto";
import "protobuf/configs/data.proto";
import "protobuf/configs/log.proto";
import "protobuf/configs/observability.proto";

// BattleConf 是战斗域直连出票配置（阶段 3 批次 2）：
// 入场票据的 AEAD 密钥与接入层各面地址，两者都由 battle 侧装配期校验。
message BattleConf {
  // ticket_key 是入场票据密钥（base64 编码的 32 字节；接入层 edge.ticket_key 必须同值）：
  // 缺失、base64 非法或长度不符即启动失败——不提供默认值。
  string ticket_key = 1;
  // ticket_ttl 是票据有效期（time.ParseDuration 字符串，如 120s；空 = 120s；
  // 必须为正）。应大于掉线重连窗口，窗口内重连可复用同一张票。
  string ticket_ttl = 2;
  // edge_endpoints 是接入层「传输面 → 地址」列表（随成局推送下发给客户端，
  // 全局唯一来源）：装配期校验**至少一面、面不重复、地址非空**，违反即启动失败。
  // 复用 battle.v1.EdgeEndpoint（不另定义同形消息）：配置与契约共用同一套面枚举，
  // 避免两处词表漂移。**不要求三面齐全**——只开 ws 的部署也能启动，缺面只影响用该面的客户端。
  repeated battle.v1.EdgeEndpoint edge_endpoints = 3;
  // frame_advertise_host 是**本节点帧端口对外的可达主机**——接入层从哪个主机能拨到本节点的
  // ws/kcp/udp 帧端口（与 edge_endpoints 的语义不同：后者是**给客户端拨的接入层地址**）。
  // 帧端口不在这里：端口取帧面服务端已绑定的真实地址。
  //   - 不配（字段缺失）：回落到 edge_endpoints 的主机——**该回落仅适合同机部署**
  //     （接入层与 battle 同一主机）；跨机部署必须显式配置，否则注册出去的端点会指向
  //     接入层主机，接入层会拿自己的地址去拨后端（表现为连不上后端，且极难定位）；
  //   - 显式配置：必须是非空、**不含端口**的主机部分（如 10.10.9.36 或 battle.internal）；
  //     配了空串、纯空白或形如 host:port 的值一律装配期报错（不静默截断或回落）。
  optional string frame_advertise_host = 4;
  // offline_timeout 是掉线判定窗口（time.ParseDuration 字符串，如 15s；空 = 15s；必须为正；
  // 0 或负值 = 关闭掉线判定，仅测试/特例使用）。
  // 数据报面（KCP/UDP）没有关闭握手，掉线只能靠帧面的空闲读超时发现，故其 idle_timeout
  // 缺省取本值的 1/3（缺省 15s → 5s）；装配期校验「数据报面 idle < offline_timeout」，
  // 不满足即启动失败（否则掉线事件会迟到缺省的 120s，本策略形同虚设）。
  string offline_timeout = 5;
  // max_frames 是单局帧数上限（正数；**不配置 = 60**，即示例竞速在 10fps 下约 6s 一局）。
  // 与 tick_interval_ms 共同决定单局寿命（帧数上限 × 帧间隔）；到达上限即由模拟器判出
  // 位置领先者胜并走既有结算路径，故它同时是「一局最多持续多久」的唯一开关。
  // 校验：>0 且 ≤ MaxFramesLimit（20000）；显式 0/负值/超上限一律启动失败——**未配置与
  // 显式 0 必须区分**（前者取缺省 60，后者是笔误），故用 optional 而非裸标量。
  // 上限 20000 的依据（内存/快照成本，见 services/battle/internal/actor）：
  // 帧输入日志每帧每玩家一条 lockstep.Input（≈112B 含分配开销），快照每 SnapshotEvery
  // （缺省 10）帧一份（≈136B）；2 人局每帧 ≈238B，20000 帧 ≈4.8MiB/局（10fps 下 ≈33 分钟）。
  optional int64 max_frames = 6;
  // tick_interval_ms 是帧间隔（**毫秒整数**；不配置 = 100）。选毫秒整数而非
  // google.protobuf.Duration：本文件既有的两个时长字段（ticket_ttl / offline_timeout）
  // 都是「字符串 + time.ParseDuration」，仓内无任何 Duration 用法；毫秒整数与 server.proto
  // 的 int32/int64 数值风格一致，且免去 Duration 的秒/纳秒双字段误配。
  // 校验：>0 且 ≤ MaxTickIntervalMillis（1000）；显式 0/负值/超上限一律启动失败。
  // 上限 1000ms 的依据：① 帧同步语义——帧间隔 >1s 时客户端插值/预测窗口失效；
  // ② 与数据报面空闲读超时耦合——server.kcp/udp 的 idle_timeout 缺省取 offline_timeout/3
  //（缺省 15s → 5s），帧间隔 1s 时尚有 5 帧余量，再大则丢一两个包就可能被空闲超时误判掉线。
  optional int64 tick_interval_ms = 7;
}

message Bootstrap {
  atlas.configs.Runtime runtime = 1;
  atlas.configs.Registry registry = 2;
  atlas.configs.Server server = 3;
  atlas.configs.Data data = 4;
  atlas.configs.Log log = 5;
  // observability 是可观测性配置（OTLP 导出端点；空 = noop 不导出）。
  atlas.configs.Observability observability = 6;
  // battle 是直连出票配置（批次 2 起必填：缺段/缺密钥即启动失败）。
  BattleConf battle = 7;
}
