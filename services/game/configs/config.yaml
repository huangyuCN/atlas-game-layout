runtime:
  name: game
  id: game-1
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  grpc:
    addr: 0.0.0.0:9100
  http:
    addr: 0.0.0.0:9180
data:
  redis:
    addr: 127.0.0.1:16379
  nats:
    url: nats://127.0.0.1:14222
  mongo:
    uri: mongodb://127.0.0.1:27017
    database: game
log:
  level: info
  format: text
  file: logs/game.log

# 可观测性：OTLP 链路导出端点（Tempo 的 gRPC 端口；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
observability:
  otlp: 127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9150
