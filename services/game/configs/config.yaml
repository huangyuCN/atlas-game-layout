runtime:
  name: game
  # id 缺省取主机名：注册实例 ID、actor NodeID 与指标 service_instance_id 三处同源，
  # 且同名服务多副本部署在不同主机时天然唯一（同主机多副本才需在此显式配唯一 id）。
  # version 缺省取构建注入版本（lib/version，Makefile/CI 经 -ldflags 写入）；需要时在此覆盖
  env: test        # 进链路资源 deployment.environment.name，并决定注册中心键前缀 /atlas/services/<env>
registry:
  etcd:
    endpoints:
      - 127.0.0.1:12379
server:
  grpc:
    addr: 0.0.0.0:9100
    timeout: 30s                  # 单次 RPC 超时；Atlas 默认 1s，本模板显式放宽到 30s
    reflection: true              # 调试/测试开启；生产应关闭（会暴露服务清单）
    # stream_timeout: 30s         # 流式 RPC 超时（不配 = 不限）
    # max_recv_msg_size: 4194304  # 单条消息接收上限（字节，不配 = 4MB）
    # metadata: true              # 注册 gRPC metadata 服务
    # admin: true                 # 注册 gRPC admin（channelz）服务
    # network: NETWORK_TCP4       # 网络类型：NETWORK_TCP(缺省)/NETWORK_TCP4/NETWORK_TCP6/NETWORK_UNIX
    # tls:                        # TLS；不配 = 明文。字段见 protobuf/configs/server.proto
    #   enabled: true
    #   cert_file: configs/tls/server.crt
    #   key_file: configs/tls/server.key
    #   ca_file: configs/tls/ca.crt   # 配了即校验客户端证书（client_auth=true 时强制要求）
    #   client_auth: false
  http:
    addr: 0.0.0.0:9180
    timeout: 30s                  # 单次请求 handler 总执行时间（与 Atlas 默认 30s 相同，显式写出便于调整）
    # path_prefix: /api           # 路由前缀（不配 = 无前缀）
    # max_request_body: 1048576   # 请求体上限（字节，不配 = 1MB）
    # strict_slash: true          # 严格斜杠（不配 = Atlas 默认 true）
    # network: NETWORK_TCP4       # 网络类型：NETWORK_TCP(缺省)/NETWORK_TCP4/NETWORK_TCP6/NETWORK_UNIX
    # tls:                        # TLS；不配 = 明文。字段见 protobuf/configs/server.proto
    #   enabled: true
    #   cert_file: configs/tls/server.crt
    #   key_file: configs/tls/server.key
    #   ca_file: configs/tls/ca.crt   # 配了即校验客户端证书（client_auth=true 时强制要求）
    #   client_auth: false
data:
  redis:
    # mode 缺省即 single（单点）；哨兵/集群形态与字段见 protobuf/configs/data.proto
    addrs:
      - 127.0.0.1:16379
  nats:
    url: nats://127.0.0.1:14222
  mongo:
    uri: mongodb://127.0.0.1:27017
    database: game
log:
  level: info
  format: text
  file: logs/game.log

# 可观测性：OTLP 链路导出端点（必须带 scheme：grpc/grpcs/http/https；空或不配 = noop 不导出）
# 与 Prometheus 抓取端点（prometheus 服务经 host.docker.internal 抓取；空或不配 = noop）。
# 采样：sampler 缺省跟随父级、根 span 按 sample_ratio 抽取（sample_ratio 缺省 1.0）。
observability:
  otlp: grpc://127.0.0.1:4317
  metrics:
    prometheus: 0.0.0.0:9150
