                    description: |-
                        battle_id 是**调用方分配**的目标战斗标识（actor key），必须随请求携带：
                         RPC 面（gRPC）没有 PID 概念，接入层正是按这个字段寻址 battle:<battle_id>；
                         matcher 生成 id 后填入，管理面未填时回落 match_id（保持既有行为）。
            description: CreateBattleRequest 开局：matcher 成局后调用。
        CreatePartyReply:
            type: object
            properties:
