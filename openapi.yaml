                    type: array
                    items:
                        $ref: '#/components/schemas/PartyMember'
            description: PartyInfo 队伍名册快照（队长 + 全部成员）。
        PartyMember:
            type: object
            properties:
                playerId:
                    type: string
                level:
                    type: integer
                    format: int32
        PlayerSummary:
            type: object
            properties:
                playerId:
                    type: string
                nickname:
                    type: string
                level:
                    type: integer
                    format: int32
            description: PlayerSummary 是玩家摘要（登录回执、匹配票、推送等场景复用）。
        QueryMatchReply:
            type: object
            properties:
                state:
                    type: integer
                    format: enum
                ticketId:
                    type: string
                matchId:
                    type: string
                battleId:
                    type: string
            description: |-
                QueryMatchReply 匹配状态：waiting（排队中）/matched（已成局）/failed（失败）/none（无匹配）。
                 battle_id 在 matched 态回执，供「开局推送丢失后重登恢复加入对局」。
        QueueMatchReply:
            type: object
            properties:
                ticketId:
                    type: string
            description: QueueMatchReply 入队回执：ticket_id 用于取消/查询与事件关联。
        QueueMatchRequest:
            type: object
            properties:
                playerId:
                    type: string
                player:
                    $ref: '#/components/schemas/PlayerSummary'
                ruleset:
                    type: string
            description: |-
                QueueMatchRequest 入队：玩家属性快照 ticket（纯撮合，matcher 不查库）。
                 player 字段是服务端权威数据（由 game PlayerActor 从聚合根组装），非客户端自报。
        QueuePartyReply:
            type: object
            properties:
                ticketId:
                    type: string
            description: QueuePartyReply 整队入队回执：ticket_id 关联失败/成局事件。
        QueuePartyRequest:
            type: object
            properties:
                partyId:
                    type: string
                ruleset:
                    type: string
