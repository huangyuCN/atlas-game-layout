// 公共配置：服务注册中心。
//
// 缺省约定（唯一规则）见 docs/config.md：etcd.endpoints 是必需参数（为空即不装配注册中心，
// 构造期报错）；ttl 为空 = 不覆盖底层默认（15s）。
syntax = "proto3";

package atlas.configs;

option go_package = "github.com/huangyuCN/atlas-game-layout/protobuf/configs;configs";

message Registry {
  message Etcd {
    repeated string endpoints = 1;
  }
  Etcd etcd = 1;
  // 号 2 原为 namespace（注册中心键前缀）：与 runtime.namespace 重复且 YAML 中从未出现，
  // 已删除——键前缀统一由 runtime.namespace 经 atlas/namespace.Derive 派生，本段不再有命名空间字段。
  reserved 2;
  reserved "namespace";
  // ttl 是注册租约的存活时间（time.ParseDuration 字符串，如 15s；空 = 底层默认 15s），
  // 心跳自动续租。
  string ttl = 3;
}
