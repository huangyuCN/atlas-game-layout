// 公共配置：传输层启动参数（gRPC 服务间调用、HTTP 健康/管理）。
//
// 空值约定：字符串为空、数值为 0、optional 字段未设置，一律表示「交给底层默认值，不覆盖」——
// 避免「不配就变行为」与「配了等于没配」。时长字段统一为字符串（time.ParseDuration，如 30s/1m），
// 解析失败在启动期直接报错。
syntax = "proto3";

package atlas.configs;

option go_package = "github.com/huangyuCN/atlas-game-layout/protobuf/configs;configs";

message Server {
  // TLS 是传输层 TLS 配置（HTTP/gRPC 共用；enabled=false 时忽略其余字段）。
  message TLS {
    // enabled 为 true 时启用 TLS。
    bool enabled = 1;
    // cert_file 是服务端证书链路径（PEM）。
    string cert_file = 2;
    // key_file 是服务端私钥路径（PEM）。
    string key_file = 3;
    // ca_file 是客户端 CA 证书路径（PEM）；client_auth=true 时用于校验客户端。
    string ca_file = 4;
    // client_auth 为 true 时要求并校验客户端证书（mTLS）。
    bool client_auth = 5;
  }
  // Network 是监听网络类型（语义有限值，故用枚举而非散落字符串）。
  enum Network {
    // NETWORK_TCP 是 TCP（缺省，IPv4/IPv6 均可）。
    NETWORK_TCP = 0;
    // NETWORK_TCP4 是仅 IPv4 的 TCP。
    NETWORK_TCP4 = 1;
    // NETWORK_TCP6 是仅 IPv6 的 TCP。
    NETWORK_TCP6 = 2;
    // NETWORK_UNIX 是 Unix 域套接字（addr 写套接字路径）。
    NETWORK_UNIX = 3;
  }
  message GRPC {
    // network 是网络类型；未设置 = 底层默认 tcp。
    optional Network network = 1;
    // addr 是监听地址 host:port；空 = 随机端口。
    string addr = 2;
    // timeout 是单次 RPC 超时（如 1s）；空 = 底层默认。
    string timeout = 3;
    // stream_timeout 是流式 RPC 超时；空或 0 = 不限制。
    string stream_timeout = 4;
    // max_recv_msg_size 是单条消息接收上限（字节）；0 = 底层默认。
    int32 max_recv_msg_size = 5;
    // reflection 是否开启 gRPC reflection（底层默认关闭；仅调试/测试环境建议开启）。
    bool reflection = 6;
    // metadata 是否注册 metadata 服务。
    bool metadata = 7;
    // admin 是否注册 admin 服务。
    bool admin = 8;
    // tls 是 TLS 配置；不配 = 明文。
    TLS tls = 9;
  }
  message HTTP {
    // network 是网络类型；未设置 = 底层默认 tcp。
    optional Network network = 1;
    // addr 是监听地址 host:port；空 = 随机端口。
    string addr = 2;
    // timeout 是单次请求 handler 的总执行时间（如 30s）；空 = 底层默认。
    string timeout = 3;
    // path_prefix 是路由前缀；空 = 无前缀。
    string path_prefix = 4;
    // strict_slash 是否严格斜杠（底层默认 true）；未设置时保持底层默认。
    optional bool strict_slash = 5;
    // max_request_body 是请求体上限（字节）；0 = 底层默认。
    int64 max_request_body = 6;
    // tls 是 TLS 配置；不配 = 明文。
    TLS tls = 7;
  }
  // TCP 是 TCP 业务通道启动参数（客户端长连接接入）。
  message TCP {
    // addr 是监听地址 host:port；空 = 随机端口。
    string addr = 1;
    // no_delay 是否关闭 Nagle 算法（TCP_NODELAY）；未设置 = 底层默认。
    optional bool no_delay = 2;
    // read_buffer 是读缓冲字节数；0 = 底层默认。
    int32 read_buffer = 3;
    // write_buffer 是写缓冲字节数；0 = 底层默认。
    int32 write_buffer = 4;
    // keep_alive 是 TCP keepalive 间隔（如 30s）；空 = 底层默认。
    string keep_alive = 5;
    // pool_size 是读写缓冲池大小；0 = 底层默认。
    int32 pool_size = 6;
    // idle_timeout 是连接空闲超时（如 60s）；空 = 不限。
    string idle_timeout = 7;
    // write_timeout 是单次写超时；空 = 不限。
    string write_timeout = 8;
    // max_conns 是最大并发连接数；0 = 不限。
    int32 max_conns = 9;
    // max_body_size 是单帧最大字节数；0 = 底层默认。
    int64 max_body_size = 10;
    // tls 是 TLS 配置；不配 = 明文。
    TLS tls = 11;
  }
  // WebSocket 是 WebSocket 单通道启动参数（业务与战斗共用一条连接）。
  message WebSocket {
    // addr 是监听地址 host:port；空 = 随机端口。
    string addr = 1;
    // path 是 WS 挂载路径（如 /ws）；空 = "/"。
    string path = 2;
    // pool_size 是读写缓冲池大小；0 = 底层默认。
    int32 pool_size = 3;
    // read_buffer 是读缓冲字节数（与 write_buffer 成对，对应底层 BufferSize）；0 = 底层默认。
    int32 read_buffer = 4;
    // write_buffer 是写缓冲字节数；0 = 底层默认。
    int32 write_buffer = 5;
    // idle_timeout 是连接空闲超时；空 = 不限。
    string idle_timeout = 6;
    // write_timeout 是单次写超时；空 = 不限。
    string write_timeout = 7;
    // read_limit 是单条消息读上限（字节）；0 = 底层默认。
    int64 read_limit = 8;
    // max_conns 是最大并发连接数；0 = 不限。
    int32 max_conns = 9;
    // max_body_size 是单帧最大字节数；0 = 底层默认。
    int64 max_body_size = 10;
    // subprotocols 是协商的子协议列表；空 = 不限定。
    repeated string subprotocols = 11;
    // tls 是 TLS 配置；不配 = 明文。
    TLS tls = 12;
  }
  // KCP 是 KCP 战斗通道启动参数（可靠 UDP）。
  message KCP {
    // addr 是监听地址 host:port；空 = 随机端口。
    string addr = 1;
    // block_crypt 是加密口令（字节数不足底层最小长度会启动失败）；空 = 不加密。
    string block_crypt = 2;
    // fec_data_shards 是 FEC 数据分片数（与 fec_parity_shards 必须成对配置）。
    int32 fec_data_shards = 3;
    // fec_parity_shards 是 FEC 校验分片数。
    int32 fec_parity_shards = 4;
    // mtu 是最大传输单元（字节）；0 = 底层默认。
    int32 mtu = 5;
    // window_snd 是发送窗口大小（与 window_rcv 必须成对配置）。
    int32 window_snd = 6;
    // window_rcv 是接收窗口大小。
    int32 window_rcv = 7;
    // fast_profile 启用低延迟预设（nodelay/interval/resend/nc）；显式参数优先于预设。
    bool fast_profile = 8;
    // lan_profile 启用局域网预设；显式参数优先于预设。
    bool lan_profile = 9;
    // max_body_size 是单帧最大字节数；0 = 底层默认。
    int64 max_body_size = 10;
    // idle_timeout 是连接空闲超时；空 = 不限。
    string idle_timeout = 11;
    // write_timeout 是单次写超时；空 = 不限。
    string write_timeout = 12;
    // max_conns 是最大并发连接数；0 = 不限。
    int32 max_conns = 13;
  }
  // UDP 是 UDP 战斗通道启动参数（不可靠、低延迟）。
  message UDP {
    // addr 是监听地址 host:port；空 = 随机端口。
    string addr = 1;
    // pool_size 是读写缓冲池大小；0 = 底层默认。
    int32 pool_size = 2;
    // read_buffer 是单包读缓冲字节数；0 = 底层默认。
    int32 read_buffer = 3;
    // max_body_size 是单包最大字节数；0 = 底层默认。
    int64 max_body_size = 4;
    // idle_timeout 是对端空闲超时；空 = 不限。
    string idle_timeout = 5;
    // max_peers 是最大对端数；0 = 不限。
    int32 max_peers = 6;
  }
  GRPC grpc = 1;
  HTTP http = 2;
  // tcp/websocket/kcp/udp 是客户端接入通道：不配该节 = 该协议不启用
  // （网关只启动与注册已声明的协议）。
  TCP tcp = 3;
  WebSocket websocket = 4;
  KCP kcp = 5;
  UDP udp = 6;
}
