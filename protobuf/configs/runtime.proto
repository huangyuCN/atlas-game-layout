// 公共配置：服务运行时身份（服务名/实例/版本/环境/命名空间）。
//
// 缺省约定（唯一规则）见 docs/config.md：name 与 namespace 是必需参数——缺失即装配失败
// （namespace 走 R9 严格模式，无任何兜底）；id/version/env 为空 = 回填缺省，
// 其中 env **仅作链路与指标标签**，不参与任何前缀派生。
syntax = "proto3";

package atlas.configs;

option go_package = "github.com/huangyuCN/atlas-game-layout/protobuf/configs;configs";

message Runtime {
  string name = 1;
  string id = 2;
  string version = 3;
  string env = 4;
  // namespace 是**唯一命名空间字段**：注册中心键前缀 /atlas/services/<ns>、actor subject 前缀
  // atlas_actor.<ns>、业务 topic 前缀 atlas.<ns>、redis 键前缀 atlas:<ns>:、etcd 目录 /atlas/actors/<ns>
  // 五面全部由它派生（框架唯一派生点 atlas/namespace.Derive，本仓不再自行拼任何前缀）。
  // **必须显式配置，缺失即启动失败**（严格模式 R9：不回落 env、不回落 default、不静默归一）；
  // 取值限 [A-Za-z0-9_-]，非法字符同样启动失败。env 仅作链路与指标标签，不参与任何前缀派生。
  // 缺省约定与五面派生表见 docs/config.md。
  string namespace = 5;
  // min_client_version 是允许登录的最低客户端版本（semver，如 1.4.0）。
  // **空 = 仅记录**（放行并打日志，保持既有行为）；**非空 = 登录期强制**：低于该版本、
  // 未上报版本或版本串无法识别的客户端在建会话之前就被拒绝（reason CLIENT_VERSION_TOO_LOW）。
  // 阶段 3 起战斗帧由客户端凭票据直连，老客户端会「匹配成功但连不上」，故门槛成为必需。
  string min_client_version = 6;
  // min_client_version_mode 是客户端版本门槛的执行模式：**缺省/OFF/ENFORCE 同义**（只要门槛非空即强制，
  // 刻意不做「漏配 mode 就静默降级」——那正是「匹配成功但连不上」的成因）；仅显式 NEGOTIATE 才降级为只记录。
  MinClientVersionMode min_client_version_mode = 7;
}

// MinClientVersionMode 是客户端版本门槛的执行模式（协议演进用：客户端是长生命周期二进制，
// 删改 op 前必须能协商与废弃，见统一设计 v2 的 M1）。
enum MinClientVersionMode {
  // MIN_CLIENT_VERSION_MODE_OFF 与缺省同义：门槛为空时仅记录；门槛非空时**仍强制**。
  MIN_CLIENT_VERSION_MODE_OFF = 0;
  // MIN_CLIENT_VERSION_MODE_NEGOTIATE 只协商：记录并暴露客户端版本，不拒绝（灰度期观察用）。
  MIN_CLIENT_VERSION_MODE_NEGOTIATE = 1;
  // MIN_CLIENT_VERSION_MODE_ENFORCE 强制：低于 min_client_version 的客户端登录被拒（带明确 reason）。
  MIN_CLIENT_VERSION_MODE_ENFORCE = 2;
}
