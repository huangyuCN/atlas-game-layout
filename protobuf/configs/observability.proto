// 公共配置：可观测性（链路追踪 OTLP 导出 + 指标暴露）。
//
// 缺省约定（唯一规则）见 docs/config.md：otlp 端点与 metrics.prometheus 地址是必需参数——
// 为空 = 该 exporter/抓取端点不启用（noop，零开销）；配置后服务侧 span 经 OTLP 导出到
// Tempo/Jaeger 等后端（gRPC 或 HTTP，由端点 scheme 决定），Grafana 面板查询链路；
// 指标经 Prometheus 文本端点暴露，由 Prometheus 抓取、Grafana 面板查询。
syntax = "proto3";

package atlas.configs;

option go_package = "github.com/huangyuCN/atlas-game-layout/protobuf/configs;configs";

// TraceSampler 是链路采样器种类。
enum TraceSampler {
  // TRACE_SAMPLER_PARENT_BASED_RATIO 跟随上游采样决策，根 span 按 sample_ratio 抽取（默认）。
  TRACE_SAMPLER_PARENT_BASED_RATIO = 0;
  // TRACE_SAMPLER_ALWAYS_ON 全量采集。
  TRACE_SAMPLER_ALWAYS_ON = 1;
  // TRACE_SAMPLER_ALWAYS_OFF 全量丢弃。
  TRACE_SAMPLER_ALWAYS_OFF = 2;
}

message Observability {
  // otlp 是 OTLP 导出端点，必须带 scheme：
  // grpc://（明文 gRPC）/ grpcs://（TLS gRPC）/ http://（OTLP/HTTP 明文）/ https://（OTLP/HTTP+TLS）；
  // http(s) 不带 path 时使用导出器默认路径 /v1/traces。空 = 不导出。
  string otlp = 1;
  // metrics 是指标暴露配置；不配置 = 不暴露任何端点（noop，零开销）。
  Metrics metrics = 2;
  // sampler 是采样器；不配置 = 跟随父级、根 span 按 sample_ratio 抽取。
  TraceSampler sampler = 3;
  // sample_ratio 是采样率（0..1，缺省 1.0）；仅 PARENT_BASED_RATIO 使用。
  optional double sample_ratio = 4;
  // pprof 是 Go 运行时剖析（pprof）端点的监听地址（host:port，如 127.0.0.1:6060）；
  // **空 = 不监听任何端口**（默认关闭，零开销）。
  //
  // 安全：/debug/pprof/ 会暴露进程内存、goroutine 与调用栈——**只能绑回环或内网**，
  // 公网暴露等于把内存与调用栈交出去；生产建议按需临时开启（压测剖析/内存排查），
  // 采样完立即关闭。各服务建议端口（同机起全栈时避免撞端口，见 docs/config.md）：
  // gateway 6060 / game 6061 / matcher 6062 / battle 6063 / edge 6064。
  string pprof = 5;
  // block_profile_rate 是 Go 阻塞事件采样率（runtime.SetBlockProfileRate 的入参，纳秒粒度）：
  // **0 = 关闭**（默认，零开销）；1 = 记录每次阻塞事件；n = 平均每 n 纳秒的阻塞量记录一次。
  // 开启后 /debug/pprof/block 可看到阻塞样本（用于定位排队/锁问题）；负数 = **装配期失败**。
  int32 block_profile_rate = 6;
  // mutex_profile_fraction 是互斥锁竞争采样分数（runtime.SetMutexProfileFraction 的入参）：
  // **0 = 关闭**（默认，零开销）；1 = 记录每次竞争；n = 平均每 n 次竞争记录一次。
  // 开启后 /debug/pprof/mutex 可看到持锁样本；负数 = **装配期失败**。
  int32 mutex_profile_fraction = 7;
}

// Metrics 是指标暴露配置。
message Metrics {
  // prometheus 是 Prometheus 抓取端点监听地址（host:port，如 0.0.0.0:9150）；
  // 空 = 不暴露（采集器退化为 noop）。
  string prometheus = 1;
}
