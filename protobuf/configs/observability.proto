// 公共配置：可观测性（链路追踪 OTLP 导出端点）。
// 空端点 = 不注册 exporter（noop，零开销）；配置后服务侧 span 经 OTLP gRPC
// 导出到 Tempo/Jaeger 等后端，Grafana 面板查询链路。
syntax = "proto3";

package atlas.configs;

option go_package = "github.com/huangyuCN/atlas-game-layout/protobuf/configs;configs";

message Observability {
  // otlp 是 OTLP gRPC 导出端点（host:port，如 127.0.0.1:4317）；空 = 不导出。
  string otlp = 1;
}
