// matcher 服务协议：入队/取消/查询。
// 调用方为 game 玩家 actor（服务端内部链路）：PlayerActor 用聚合根权威数据
// 组装 PlayerSummary（客户端不参与属性上报，反作弊前提），
// gateway 经集群转发客户端请求到 PlayerActor。
syntax = "proto3";

package matcher.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/matcher/v1;matcherv1";

import "api/common/v1/common.proto";
import "google/api/annotations.proto";

// MatchState 是玩家匹配状态（QueryMatch 与事件订阅共用语义）。
enum MatchState {
  MATCH_STATE_UNSPECIFIED = 0;
  MATCH_STATE_WAITING = 1;    // 排队中
  MATCH_STATE_MATCHED = 2;    // 已成局
  MATCH_STATE_FAILED = 3;     // 失败（超时/取消/异常）
  MATCH_STATE_NONE = 4;       // 无匹配记录
}

// QueueMatchRequest 入队：玩家属性快照 ticket（纯撮合，matcher 不查库）。
// player 字段是服务端权威数据（由 game PlayerActor 从聚合根组装），非客户端自报。
message QueueMatchRequest {
  string player_id = 1;
  common.v1.PlayerSummary player = 2;
  string ruleset = 3;
}

// QueueMatchReply 入队回执：ticket_id 用于取消/查询与事件关联。
message QueueMatchReply {
  string ticket_id = 1;
}

message CancelMatchRequest {
  string player_id = 1;
}

message CancelMatchReply {
  bool canceled = 1;
}

// QueryMatchRequest 查询玩家当前匹配状态。
message QueryMatchRequest {
  string player_id = 1;
}

// QueryMatchReply 匹配状态：waiting（排队中）/matched（已成局）/failed（失败）/none（无匹配）。
// battle_id 在 matched 态回执，供「开局推送丢失后重登恢复加入对局」。
message QueryMatchReply {
  MatchState state = 1;
  string ticket_id = 2;
  string match_id = 3;
  string battle_id = 4;
}

// ---- 灵活组队（1..N 人，整队票；属性均为服务端权威，调用方为各成员自己的 PlayerActor）----

// PartyInfo 队伍名册快照（队长 + 全部成员）。
message PartyInfo {
  string party_id = 1;
  string leader_id = 2;
  repeated PartyMember members = 3;
}

message PartyMember {
  string player_id = 1;
  int32 level = 2;
}

message CreatePartyRequest {
  string player_id = 1;
  common.v1.PlayerSummary player = 2;
}

// CreatePartyReply 建队回执：party_id 即队伍标识（分享给成员加入）。
message CreatePartyReply {
  string party_id = 1;
}

message JoinPartyRequest {
  string party_id = 1;
  string player_id = 2;
  common.v1.PlayerSummary player = 3;
}

message JoinPartyReply {}

message LeavePartyRequest {
  string party_id = 1;
  string player_id = 2;
}

message LeavePartyReply {}

message DescribePartyRequest {
  string party_id = 1;
}

message QueuePartyRequest {
  string party_id = 1;
  string ruleset = 2;
}

// QueuePartyReply 整队入队回执：ticket_id 关联失败/成局事件。
message QueuePartyReply {
  string ticket_id = 1;
}

// Matcher 是撮合服务。
service Matcher {
  rpc QueueMatch (QueueMatchRequest) returns (QueueMatchReply) {
    option (google.api.http) = {
      post: "/v1/matcher/queue"
      body: "*"
    };
  }
  rpc CancelMatch (CancelMatchRequest) returns (CancelMatchReply) {
    option (google.api.http) = {
      post: "/v1/matcher/cancel"
      body: "*"
    };
  }
  rpc QueryMatch (QueryMatchRequest) returns (QueryMatchReply) {
    option (google.api.http) = {
      get: "/v1/matcher/query/{player_id}"
    };
  }
  // CreateParty 队长建队（名册权威在撮合域 redis，带 TTL）。
  rpc CreateParty (CreatePartyRequest) returns (CreatePartyReply) {
    option (google.api.http) = {
      post: "/v1/matcher/party/create"
      body: "*"
    };
  }
  // JoinParty 按 party_id 加入队伍（容量原子校验，满员拒绝）。
  rpc JoinParty (JoinPartyRequest) returns (JoinPartyReply) {
    option (google.api.http) = {
      post: "/v1/matcher/party/join"
      body: "*"
    };
  }
  // LeaveParty 离开队伍（队长顺延；空队解散）。
  rpc LeaveParty (LeavePartyRequest) returns (LeavePartyReply) {
    option (google.api.http) = {
      post: "/v1/matcher/party/leave"
      body: "*"
    };
  }
  // DescribeParty 名册快照（轮询兜底用）。
  rpc DescribeParty (DescribePartyRequest) returns (PartyInfo) {
    option (google.api.http) = {
      get: "/v1/matcher/party/{party_id}"
    };
  }
  // QueueParty 队长发整队入队（1..N 人都可入队，等对面凑齐等量人数）。
  rpc QueueParty (QueuePartyRequest) returns (QueuePartyReply) {
    option (google.api.http) = {
      post: "/v1/matcher/party/queue"
      body: "*"
    };
  }
}
