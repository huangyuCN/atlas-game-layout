// gateway 客户端协议（业务通道：tcp/ws 传输）：注册/登录/心跳与挤下线通知。
syntax = "proto3";

package gateway.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/gateway/v1;gatewayv1";

import "api/common/v1/common.proto";

// RegisterRequest 注册：账号不存在则创建玩家。
message RegisterRequest {
  string account = 1;
  string password = 2;
  string nickname = 3;
}

message RegisterReply {
  string player_id = 1;
}

// LoginRequest 登录：凭注册回执的玩家 ID 建立会话（注册与登录两段式，D8）。
message LoginRequest {
  string player_id = 1;
  string password = 2;
}

// LoginReply 登录回执：token 用于战斗通道绑定与后续鉴权。
message LoginReply {
  string player_id = 1;
  string token = 2;
  common.v1.PlayerSummary player = 3;
}

// HeartbeatRequest 心跳保活（携带令牌与玩家 ID，服务端续租路由 TTL）。
message HeartbeatRequest {
  string token = 1;
  string player_id = 2;
  int64 ts = 3;
}

// HeartbeatReply 心跳回执（携带服务端时间用于对时）。
message HeartbeatReply {
  int64 ts = 1;
  uint64 server_time_unix_ms = 2;
}

// LogoutRequest 登出（清理会话与路由）。
message LogoutRequest {
  string token = 1;
  string player_id = 2;
}

message LogoutReply {}

// KickedNotify 服务端推送：被挤下线（旧连接断开前收到）。
message KickedNotify {
  string reason = 1;
}

// GatewayAuth 是网关认证服务（业务通道协议）。
service GatewayAuth {
  rpc Register (RegisterRequest) returns (RegisterReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc Logout (LogoutRequest) returns (LogoutReply);
}
