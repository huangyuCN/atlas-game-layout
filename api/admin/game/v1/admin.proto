// 用途：game 的 GM/运维管理面（发道具、查玩家/背包/审计）；仅限内网管理工具调用，
//   不经网关、不暴露给客户端。
// 边界：本面只做「校验 + 幂等 + 审计 + 转发」，业务写仍收敛到域面
//   （game.v1.PlayerService 的 ACCESS_INTERNAL op → PlayerActor 聚合根单写者）；
//   禁止在本面直连 mongo/redis 改业务数据，禁止生成 actor/HTTP/客户端 SDK 产物
//   （由 Makefile 的 API_ADMIN_PROTOS 隔离：只进 --go_out/--go-grpc_out/--openapi_out）。
// 鉴权前提：本轮内网明文、无鉴权、**不加 IP 白名单/ACL**（R12），operator 为调用方自报、可伪造；
//   将来接外部服务必须由鉴权主体注入 operator（请求字段被覆盖或拒绝）并启用 mTLS——补法见 P7 计划风险 1。
syntax = "proto3";

package admin.game.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/admin/game/v1;admingamev1";

// AdminService 是 game 的管理面服务（不要加 atlas.route.v1 / google.api.http 注解：
// 加了会产出 actor 桩、客户端 SDK 或对外 REST 路由，等于把管理面暴露给客户端）。
service AdminService {
  rpc GrantItem (GrantItemRequest) returns (GrantItemReply);
  rpc QueryPlayer (QueryPlayerRequest) returns (QueryPlayerReply);
  rpc QueryBackpack (QueryBackpackRequest) returns (QueryBackpackReply);
  rpc QueryAudits (QueryAuditsRequest) returns (QueryAuditsReply);
}

// AdminContext 是所有管理面请求的统一信封：写操作 operator/idempotency_key 必填。
message AdminContext {
  string operator = 1;         // 操作者标识（GM 账号/工具名）；将来由鉴权主体注入
  string idempotency_key = 2;  // 写操作必填：请求级幂等键（GM 重试安全，唯一索引兜底）
  string reason = 3;           // 工单/纠纷单号或说明（审计可读性）
  bool dry_run = 4;            // true = 只校验不改档（仍写审计，但不占用幂等键）
}

// GrantItemRequest 是发道具请求：count 受 admin.max_grant_count 单次上限约束
// （dry_run=true 同样受限）。
message GrantItemRequest {
  AdminContext context = 1;
  string player_id = 2;
  uint32 item_id = 3;
  uint32 count = 4;
}

// GrantItemReply 是发道具回执：replayed=true 表示同键幂等命中（返回首次结果，未重复执行）；
// violations 是 dry-run 的校验未通过项（真发放时为空）。
message GrantItemReply {
  string audit_id = 1;
  bool applied = 2;
  bool replayed = 3;
  repeated string violations = 4;
}

// QueryPlayerRequest 是查玩家请求（读操作不要求幂等键）。
message QueryPlayerRequest {
  AdminContext context = 1;
  string player_id = 2;
}

// QueryPlayerReply 是玩家读模型（管理面自己的投影，不直接复用域 proto 消息）。
message QueryPlayerReply {
  string player_id = 1;
  string nickname = 2;
  int32 level = 3;
}

// QueryBackpackRequest 是查背包请求。
message QueryBackpackRequest {
  AdminContext context = 1;
  string player_id = 2;
}

// QueryBackpackReply 是背包读模型。
message QueryBackpackReply {
  string player_id = 1;
  repeated BackpackItem items = 2;
}

// BackpackItem 是**管理面自己的读模型**（不与 game.v1.BackpackItem 共用定义，
//   避免管理面契约寄生在域 proto 上）；handler 做一次显式字段映射。
message BackpackItem {
  uint32 item_id = 1;
  uint32 count = 2;
}

// 分页约定（所有列表接口统一）：空 token = 首页；page_size 默认 20、上限 200，
//   超上限报 InvalidParams（不静默截断）；next_page_token 为空 = 末页；
//   排序键稳定（created_at 降序 + _id 兜底），token 为不透明游标、不得解析复用。
// QueryAuditsRequest 是审计查询请求：target_id / operator_filter 为空表示不过滤。
message QueryAuditsRequest {
  AdminContext context = 1;
  string target_id = 2;
  string operator_filter = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

// QueryAuditsReply 是审计查询回执（next_page_token 为空 = 末页）。
message QueryAuditsReply {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

// AuditResult 是审计记录的结果状态（与 models.AuditResult 一一对应；协议状态字段一律
//   用 enum，protojson 下发枚举名，客户端不必解析裸字符串）。
enum AuditResult {
  AUDIT_RESULT_UNSPECIFIED = 0;      // 未定义（落库状态非法时的兜底，不猜测）
  AUDIT_RESULT_PENDING = 1;          // 已占位、业务副作用尚未收尾
  AUDIT_RESULT_SUCCESS = 2;          // 业务副作用成功
  AUDIT_RESULT_FAILED = 3;           // 业务副作用失败（失败同样留痕）
  AUDIT_RESULT_SKIPPED_DRY_RUN = 4;  // dry-run 只校验未改档
}

// AuditEntry 是审计记录的对外投影（读模型，字段与 models.AuditRecord 对齐；不落敏感原文）。
message AuditEntry {
  string audit_id = 1;
  string operator = 2;
  string action = 3;
  string target_id = 4;
  AuditResult result = 5;  // 结果状态（取值见 AuditResult；PENDING = 未收尾）
  string reason = 6;
  string trace_id = 7;
  int64 created_at = 8;
  bool dry_run = 9;
}

// 批量约定（本轮只定规范、未实现）：写操作可用
//   `<Action>BatchRequest{ AdminContext context; repeated Entry entries; }`，
//   请求级一个幂等键、逐项结果 `repeated EntryResult`、**部分成功不回滚**、
//   上限建议 100（超限 InvalidParams）；整单一条审计记录，逐项结果写入审计 detail。
//   打样 GrantItem 暂为单目标（见 P7 计划风险 5）。
