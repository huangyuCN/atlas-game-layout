// 业务错误码：经 protoc-gen-atlas-errors 生成 Is/Err/Code/Reason 辅助函数。
syntax = "proto3";

package error.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/error/v1;errorv1";

import "errors/errors.proto";

enum ErrorReason {
  option (atlas.errors.default_code) = 400;

  None = 0;

  // 注册/登录
  PlayerNotFound = 1001 [(atlas.errors.code) = 404];      // 玩家不存在，请先注册
  PlayerAlreadyExists = 1002 [(atlas.errors.code) = 409]; // 玩家已存在
  InvalidToken = 1003 [(atlas.errors.code) = 401];        // 会话令牌无效
  KickedOffline = 1004 [(atlas.errors.code) = 401];       // 被挤下线
  TokenExpired = 1005 [(atlas.errors.code) = 401];        // 会话令牌过期
  SessionNotFound = 1006 [(atlas.errors.code) = 404];     // 会话不存在
  PlayerNotOnline = 1007 [(atlas.errors.code) = 404];     // 玩家不在线
  InvalidParams = 1008 [(atlas.errors.code) = 400];       // 参数非法
  PasswordWrong = 1009 [(atlas.errors.code) = 401];       // 口令错误
  ServerFrozen = 1010 [(atlas.errors.code) = 503];        // 服务冻结（双库落盘失败，数据保护态）
  ClientVersionTooLow = 1011 [(atlas.errors.code) = 426]; // 客户端版本过低（M1：升级后方可登录）

  // 管理面（P7：admin.game.v1.AdminService，仅内网 GM/运维工具可达）
  // 号段紧接 1011 之后；管理面写操作校验失败一律拒单（不写审计、不改档）。
  AdminOperatorMissing = 1012 [(atlas.errors.code) = 400];       // 操作人缺失（operator 必填；本轮由调用方自报）
  AdminIdempotencyKeyMissing = 1013 [(atlas.errors.code) = 400]; // 幂等键缺失（管理面写操作必填）
  AdminIdempotencyKeyReused = 1014 [(atlas.errors.code) = 409];  // 幂等键复用（同键但参数摘要不同，拒绝改参重放）
  AdminOperationInFlight = 1015 [(atlas.errors.code) = 409];     // 同键操作在途（首单 PENDING 未收尾，拒绝并发重复执行）
  AdminGrantCountExceeded = 1016 [(atlas.errors.code) = 400];    // 单次发放超上限（R12：admin.max_grant_count，dry-run 同样受限）

  // 匹配
  AlreadyInMatch = 2001 [(atlas.errors.code) = 409]; // 已在匹配中
  MatchNotFound = 2002 [(atlas.errors.code) = 404];  // 匹配不存在
  PartyNotFound = 2003 [(atlas.errors.code) = 404];  // 队伍不存在或已解散
  PartyFull = 2004 [(atlas.errors.code) = 409];      // 队伍已满
  AlreadyInParty = 2005 [(atlas.errors.code) = 409]; // 已在队伍中
  NotPartyLeader = 2006 [(atlas.errors.code) = 403]; // 仅队长可执行该操作
  NotInParty = 2007 [(atlas.errors.code) = 404];     // 不在队伍中

  // 战斗
  BattleNotFound = 3001 [(atlas.errors.code) = 404]; // 战斗不存在
  BattleFull = 3002 [(atlas.errors.code) = 409];     // 战斗已满
  BattleEnded = 3003 [(atlas.errors.code) = 409];    // 战斗已结束
  // 直连入场票据（阶段 3 批次 2）：battle 帧槽验票失败的两个 reason——帧有回执，故回结构化错误；
  // 接入层拒绝走 L4 断开 + 指标标签（不进 proto，见规格 §4 错误语义分层）。
  BattleTicketInvalid = 3004 [(atlas.errors.code) = 401]; // 直连票据无效（会话槽缺失/密文非法/被篡改）
  BattleTicketExpired = 3005 [(atlas.errors.code) = 401]; // 直连票据已过期

  // 通用
  Internal = 9001 [(atlas.errors.code) = 500]; // 服务内部错误
}
