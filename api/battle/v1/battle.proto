// battle 服务协议：开局/查询（matcher 经 grpc 调用）与
// 战斗结算事件（nats 事件总线消息，game 订阅回写玩家数据）。
syntax = "proto3";

package battle.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/battle/v1;battlev1";

import "google/api/annotations.proto";
import "api/lockstep/lockstep.proto";

// CreateBattleRequest 开局：matcher 成局后调用。
message CreateBattleRequest {
  string match_id = 1;
  repeated string player_ids = 2;
}

message CreateBattleReply {
  string battle_id = 1;
}

// GetBattleRequest/Reply 战斗状态查询。
message GetBattleRequest {
  string battle_id = 1;
}

message GetBattleReply {
  string state = 1;
}

// PlayerResult 单个玩家的战斗结果。
message PlayerResult {
  string player_id = 1;
  bool win = 2;
  int32 score = 3;
}

// BattleSettledEvent 战斗结算事件（battle 发布 → nats → game 回写玩家数据）。
message BattleSettledEvent {
  string battle_id = 1;
  string match_id = 2;
  repeated PlayerResult players = 3;
}

// JoinBattleReq 玩家加入战斗（gateway 校验 token 后转发 battle actor）。
message JoinBattleReq {
  string player_id = 1;
}

// JoinBattleReply 加入回执：会话元信息、当前帧与快照（断线重连恢复）。
message JoinBattleReply {
  atlas.game.lockstep.SessionMeta meta = 1;
  uint64 current_frame = 2;
  atlas.game.lockstep.SnapshotMeta snapshot = 3;
}

// FrameInputReq 帧输入（gateway 转发 battle actor 的 lockstep 输入通道）。
message FrameInputReq {
  string player_id = 1;
  atlas.game.lockstep.LockstepInput input = 2;
}

message FrameInputReply {}

// ReconnectReq 断线重连：携带已见帧号请求补帧。
message ReconnectReq {
  string player_id = 1;
  uint64 last_seen_frame = 2;
}

// ReconnectReply 补帧回执：当前帧、快照与缺失帧输入。
message ReconnectReply {
  uint64 current_frame = 1;
  atlas.game.lockstep.SnapshotMeta snapshot = 2;
  repeated atlas.game.lockstep.FrameInputs missed = 3;
}

// GetStateReq/Reply 战斗状态查询（grpc 管理接口转发）。
message GetStateReq {}

message GetStateReply {
  string state = 1;
  uint64 current_frame = 2;
  uint32 player_count = 3;
}

// Battle 是战斗管理服务。
service Battle {
  rpc CreateBattle (CreateBattleRequest) returns (CreateBattleReply) {
    option (google.api.http) = {
      post: "/v1/battles"
      body: "*"
    };
  }
  rpc GetBattle (GetBattleRequest) returns (GetBattleReply) {
    option (google.api.http) = {
      get: "/v1/battles/{battle_id}"
    };
  }
}
