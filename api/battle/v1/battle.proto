// battle 管理面协议：开局/查询（matcher 经 grpc 调用）与
// 战斗结算事件（nats 事件总线消息，game 订阅回写玩家数据）。
// 战斗域统一业务契约（客户端 op + actor 分发）见 battle_service.proto。
syntax = "proto3";

package battle.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/battle/v1;battlev1";


// CreateBattleRequest 开局登记参战名单（管理面/测试与既有契约保留；
// matcher 成局后的入场走 Admit——开局与出票合并，见下）。
message CreateBattleRequest {
  string match_id = 1;
  repeated string player_ids = 2;
  // battle_id 是**调用方分配**的目标战斗标识（actor key），必须随请求携带：
  // RPC 面（gRPC）没有 PID 概念，接入层正是按这个字段寻址 battle:<battle_id>；
  // matcher 生成 id 后填入，管理面未填时回落 match_id（保持既有行为）。
  string battle_id = 3;
}

message CreateBattleReply {
  string battle_id = 1;
}

// AdmitBattleReq 开局+出票请求：matcher 成局后的**唯一**入场调用
//（把原来「懒激活 battle actor 的 CreateBattle → 再 IssueEntryTicket」两跳合并成一跳）。
//
// 原子性：参战名单与票在**同一次** actor 调用里产生——签票失败即不登记任何玩家，
// 故不会留下「有名单无票」；票只随成功回执下发，故不会留下「有票无名单」。
// 幂等：同一 battle_id 重复调用原样回执首次结果（名单不翻倍、票不重签、过期时刻不变），
// 调用方超时重试安全。
message AdmitBattleReq {
  string match_id = 1;
  repeated string player_ids = 2;
  // battle_id 是目标战斗标识（actor key）：rpc 面按 service 的 uid_field 寻址
  // battle:<battle_id>，属主节点内由该 actor 处理本次开局与出票。
  string battle_id = 3;
}

// GetBattleRequest/Reply 战斗状态查询。
message GetBattleRequest {
  string battle_id = 1;
}

message GetBattleReply {
  string state = 1;
}

// PlayerResult 单个玩家的战斗结果。
message PlayerResult {
  string player_id = 1;
  bool win = 2;
  int32 score = 3;
}

// BattleSettledEvent 战斗结算事件（battle 发布 → nats → game 回写玩家数据）。
message BattleSettledEvent {
  string battle_id = 1;
  string match_id = 2;
  repeated PlayerResult players = 3;
}

// GetStateReq/Reply 战斗状态查询（grpc 管理接口转发）。
message GetStateReq {
  // battle_id 是目标战斗标识（actor key）：RPC 面按它寻址 battle:<battle_id>。
  string battle_id = 1;
}

message GetStateReply {
  string state = 1;
  uint64 current_frame = 2;
  uint32 player_count = 3;
}
