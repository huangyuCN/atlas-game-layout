// BattleService 是战斗域的统一业务契约：客户端 op 与 actor 分发共用同一份
// service/消息（帧面 ws/kcp/udp 与集群内部同构，不再有镜像投影）。
//
// 身份语义（客体寻址）：
//   - target PID = "battle:{battle_id}"（uid=UID_SOURCE_FIELD，battle_id 是
//     客体参数/操作目标）；发起者玩家身份由帧面 hello 里的 battle_ticket 解出后
//     随本地投递注入——战斗 actor 经 ActorContext.Sender() 取得加入者/输入者，
//     消息体无身份字段；
//   - access=CLIENT 为客户端 op（战斗 SDK 导出；阶段 3 批次 5 起客户端凭成局推送的
//     「接入层地址 + battle_ticket」直连接入层，由接入层转发到本服务帧面，帧不再经网关）；
//     INTERNAL 为服务端内部（matcher 开局/取票、管理面查询）。
syntax = "proto3";

package battle.v1;

option go_package = "github.com/huangyuCN/atlas-game-layout/api/battle/v1;battlev1";

import "api/atlas/v1/route.proto";
import "api/battle/v1/battle.proto";
import "api/lockstep/lockstep.proto";
import "google/protobuf/empty.proto";

// JoinBattleReq 玩家加入战斗（battle_id 为客体寻址字段；发起者由 sender 承载）。
message JoinBattleReq {
  string battle_id = 1;
}

// JoinBattleReply 加入回执：会话元信息、当前帧与快照（断线重连恢复）。
message JoinBattleReply {
  atlas.game.lockstep.SessionMeta meta = 1;
  uint64 current_frame = 2;
  atlas.game.lockstep.SnapshotMeta snapshot = 3;
}

// FrameInputReq 帧输入上行（客户端 → 接入层 → battle 帧面 → 本地 actor 的 lockstep 输入通道）。
message FrameInputReq {
  string battle_id = 1;
  atlas.game.lockstep.LockstepInput input = 2;
}

message FrameInputReply {}

// SyncFramesReq 补帧：断线重连后携带已见帧号按帧区间拉取缺失帧。
message SyncFramesReq {
  string battle_id = 1;
  uint64 last_seen_frame = 2;
}

// SyncFramesReply 补帧回执：当前帧、快照与缺失帧输入。
message SyncFramesReply {
  uint64 current_frame = 1;
  atlas.game.lockstep.SnapshotMeta snapshot = 2;
  repeated atlas.game.lockstep.FrameInputs missed = 3;
}

// PingReq 保活探针请求：只带客体寻址字段（target PID = battle:{battle_id}），
// 不承载任何对局参数——探针语义就是「我还在」，加参数即越界。
message PingReq {
  string battle_id = 1;
}

// IssueEntryTicketReq 出票请求：battle_id 是客体寻址字段
//（目标 PID = battle:{battle_id}，rpc 面按 uid_field 解析并懒激活该战斗 actor）。
message IssueEntryTicketReq {
  string battle_id = 1;
}

// EdgeTransport 是接入层的传输面：客户端按自身支持的传输面从 EdgeEndpoint 列表里取地址。
// 必须按面下发而不是给单个地址——接入层分面监听（ws=tcp、kcp/udp 各一个 udp 端口），
// 单地址无法让 SDK 知道该拨哪个端口。
enum EdgeTransport {
  EDGE_TRANSPORT_UNSPECIFIED = 0; // 未指定（不得下发；装配期即拒绝）
  EDGE_TRANSPORT_WS = 1;          // WebSocket（TCP 承载）
  EDGE_TRANSPORT_KCP = 2;         // KCP（可靠 UDP）
  EDGE_TRANSPORT_UDP = 3;         // 裸 UDP
}

// EdgeEndpoint 是接入层某个传输面的对外地址（host:port）。
// 地址的唯一来源是 battle 配置（edge_endpoints），matcher 只搬运、不重组。
message EdgeEndpoint {
  EdgeTransport transport = 1;
  string address = 2;
}

// BattleTicketEntry 是单个参战玩家的入场票据（player_id 与票内身份一致）。
// 票据为 AEAD 密文（contrib/edge/ticket），接入层与 battle 共持同一把 32 字节密钥。
message BattleTicketEntry {
  string player_id = 1;
  bytes ticket = 2;
}

// IssueEntryTicketReply 出票回执：接入层各传输面地址（唯一来源是 battle 配置
// edge_endpoints；至少一面、面不重复、地址非空）、按参战名单逐人签发的票据、
// 以及全部票据统一的过期时刻。
message IssueEntryTicketReply {
  repeated EdgeEndpoint endpoints = 1;
  repeated BattleTicketEntry tickets = 2;
  int64 expires_at_unix_ms = 3;
}

// BattleService 是战斗域统一业务契约（客户端 op 与 actor 分发共用一份）。
service BattleService {
  option (atlas.route.v1.service_route) = {
    actor: "battle"
    access: ACCESS_CLIENT
    uid: UID_SOURCE_FIELD
    uid_field: "battle_id"
  };
  // 客户端可达（battle:{battle_id} 客体寻址）；身份取自帧面 hello 携带的 battle_ticket，
  // 验票后由属主节点**本地投递**给战斗 actor（阶段 3 批次 5 起战斗帧不再经网关，
  // 网关侧的「转发成功后绑定战斗通道会话」副作用已随之删除）。
  rpc JoinBattle (JoinBattleReq) returns (JoinBattleReply);
  rpc SendFrameInput (FrameInputReq) returns (google.protobuf.Empty);
  rpc SyncFrames (SyncFramesReq) returns (SyncFramesReply);
  // Ping 是直连保活探针（Tell，无回执）：客户端在无输入期间周期发送，维持帧面活跃
  //（数据报面 idle 判掉线、NAT 映射保活）。不参与对局逻辑、不改对局状态。
  // 发送周期上限 = battle.offline_timeout 的数据报面空闲读超时（缺省 offline_timeout/3 = 5s）。
  rpc Ping (PingReq) returns (google.protobuf.Empty);
  // 服务端内部（matcher 开局、管理面 grpc 转发；客户端 op 不存在）。
  rpc Create (CreateBattleRequest) returns (CreateBattleReply) {
    option (atlas.route.v1.rpc_route) = { access: ACCESS_INTERNAL };
  }
  rpc GetState (GetStateReq) returns (GetStateReply) {
    option (atlas.route.v1.rpc_route) = { access: ACCESS_INTERNAL };
  }
  // IssueEntryTicket 出票（matcher 成局后调用，INTERNAL）：按本局参战名单逐人签票
  //（票绑 player_id + battle_id），并回填接入层各面地址——接入层地址只有这一个来源。
  rpc IssueEntryTicket (IssueEntryTicketReq) returns (IssueEntryTicketReply) {
    option (atlas.route.v1.rpc_route) = { access: ACCESS_INTERNAL };
  }
}

// FrameBroadcast 服务端推送：帧广播下行（op 为消息完整名）。
message FrameBroadcast {
  option (atlas.route.v1.push) = true;
  string battle_id = 1;
  atlas.game.lockstep.LockstepFrame frame = 2;
}

// BattleEndNotify 服务端推送：战斗结束通知。
message BattleEndNotify {
  option (atlas.route.v1.push) = true;
  string battle_id = 1;
  string winner_player_id = 2;
}

// PlayerOutReason 是玩家出局原因（枚举优先：原因不散落字面量）。
enum PlayerOutReason {
  PLAYER_OUT_REASON_UNSPECIFIED = 0;    // 未指定（不得下发）
  PLAYER_OUT_REASON_OFFLINE_TIMEOUT = 1; // 掉线超时判负（规格 §9.3）
}

// PlayerOutNotify 服务端推送：玩家出局通知（掉线判负并移出参战名单；
// 多人局其余玩家继续，仅剩一人时该玩家判胜并另行下发 BattleEndNotify）。
message PlayerOutNotify {
  option (atlas.route.v1.push) = true;
  string battle_id = 1;
  string player_id = 2;          // 出局玩家
  PlayerOutReason reason = 3;    // 出局原因
}
