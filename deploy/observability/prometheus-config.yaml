# Prometheus 抓取配置：自身 + 五服务（game/gateway/matcher/battle/edge）。
# 服务运行在宿主机（./bin/<svc>），Prometheus 在容器内——经 host.docker.internal
# 抓取（docker-compose 已配 extra_hosts: host-gateway）。
# 服务侧要求：conf 配置 observability.metrics.prometheus=0.0.0.0:<port>
# （模板默认 game 9150 / gateway 9151 / matcher 9152 / battle 9153 / edge 9154）。
# service 标签由服务侧常量标签下发（observability.InitMetrics 的 service=<name>）；
# 抓取目标不再重复打同名标签，避免 honor_labels=false 下被重命名为 exported_service。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警/记录规则：目录挂载见 docker-compose.yaml（./rules → /etc/prometheus/rules）。
# 阶段 3 的接入层与战斗域阈值落在 rules/atlas-alerts.yml（与 docs/config.md §7.5 同源）。
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: atlas
    static_configs:
      - targets:
          - host.docker.internal:9150
          - host.docker.internal:9151
          - host.docker.internal:9152
          - host.docker.internal:9153
          # edge（接入层）：edge_streams_active / edge_ticket_rejected_total /
          # edge_streams_teared_down_total / edge_probe_failures_total 的唯一来源，
          # 不抓则 atlas-edge-stage3 规则组恒不触发。
          - host.docker.internal:9154
