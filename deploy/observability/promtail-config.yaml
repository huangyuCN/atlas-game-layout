# Promtail 采集服务日志文件进 Loki（模板服务经 conf log.file 写 logs/<service>.log）。
server:
  http_listen_port: 9080

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: atlas
    static_configs:
      # 每个服务一个条目（文件名 = conf log.file 的服务命名约定）
      - targets: [localhost]
        labels:
          __path__: /srv/logs/game.log
          service: game
      - targets: [localhost]
        labels:
          __path__: /srv/logs/gateway.log
          service: gateway
      - targets: [localhost]
        labels:
          __path__: /srv/logs/battle.log
          service: battle
      - targets: [localhost]
        labels:
          __path__: /srv/logs/matcher.log
          service: matcher
      # edge（接入层）：阶段 3 起客户端战斗帧直连的入口，其日志是排障第一现场
      # （拒票/拆流/探活失败的原因只在它这里）。不采则 Grafana 面板 atlas-stage3 的
      # 「下行失败 reason」面板查不到 edge 侧日志。
      - targets: [localhost]
        labels:
          __path__: /srv/logs/edge.log
          service: edge
      - targets: [localhost]
        labels:
          __path__: /srv/logs/e2e.log
          service: e2e
