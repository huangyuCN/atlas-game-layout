# 模板 CI：格式 / 静态检查 / 单测 / 构建 + 集成测试（SSH 集成服务器）。
#
# 约定（与仓库 AGENTS.md 一致）：
# - 单元与构建在 GitHub runner 上执行；Atlas/cow 依赖经本地 replace 指向源码树，
#   由本 workflow 检出到工作区同级目录后编译。
# - 集成测试（test/e2e，真中间件）经 SSH 在集成服务器（10.10.9.36）执行，
#   该服务器常驻 etcd 12379 / redis 16379 / nats 14222；mongo 由 job 起一次性容器。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Atlas/cow 检出版本：模板当前以 atlas feat/actor 分支为编译基准（README 有说明）。
  ATLAS_REF: feat/actor
  COW_REF: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 模板仓库
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout Atlas（replace ../atlas）
        id: checkout-atlas
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: huangyuCN/atlas
          ref: ${{ env.ATLAS_REF }}
          path: .ci-deps/atlas
          persist-credentials: false
          token: ${{ secrets.ATLAS_CI_TOKEN || secrets.ATLAS_PAT || secrets.GH_PAT || secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout cow（replace ../cow）
        id: checkout-cow
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: huangyuCN/cow
          ref: ${{ env.COW_REF }}
          path: .ci-deps/cow
          persist-credentials: false
          token: ${{ secrets.ATLAS_CI_TOKEN || secrets.ATLAS_PAT || secrets.GH_PAT || secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: 校验 Atlas/cow 检出（私有仓库需 PAT）
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.ci-deps/atlas/go.mod" ]; then
            echo "::error::无法检出 huangyuCN/atlas（Repository not found）"
            echo "  原因：atlas 为私有仓库，GITHUB_TOKEN 无权跨仓库读取。"
            echo "  解决：请在 atlas-game-layout 仓库 Settings → Secrets and variables → Actions 中新增"
            echo "        ATLAS_CI_TOKEN（或 ATLAS_PAT / GH_PAT / CI_PAT）—— 一个有 huangyuCN/atlas 与 huangyuCN/cow 读权限的 fine-grained PAT（Contents: Read）"
            echo "        或将 atlas/cow 设为 public / internal。"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/.ci-deps/cow/go.mod" ]; then
            echo "::error::无法检出 huangyuCN/cow"
            exit 1
          fi

      - name: 移动 Atlas/cow 到 replace 路径
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$parent/atlas" "$parent/cow"
          mv "$GITHUB_WORKSPACE/.ci-deps/atlas" "$parent/atlas"
          mv "$GITHUB_WORKSPACE/.ci-deps/cow" "$parent/cow"
          rmdir "$GITHUB_WORKSPACE/.ci-deps" 2>/dev/null || true
          ls -l "$parent/atlas/go.mod" "$parent/cow/go.mod"

      - name: gofmt 检查
        run: |
          out="$(gofmt -l . | grep -v '^third_party/' || true)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -count=1 ./...

      - name: 四服务构建
        run: make build

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout 模板仓库
        uses: actions/checkout@v5

      - name: 同步代码到集成服务器
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.IT_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.IT_HOST }}
          REMOTE_USER: ${{ secrets.IT_USER }}
          TARGET: ~/atlas-game-layout
          EXCLUDE: "/.git/, /bin/"
          ARGS: "-rlgoDzvc --delete"

      - name: 集成服务器执行 e2e（真中间件）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IT_HOST }}
          username: ${{ secrets.IT_USER }}
          key: ${{ secrets.IT_SSH_PRIVATE_KEY }}
          script: |
            set -e
            # 集成依赖：etcd/redis/nats 常驻；mongo 一次性容器（已存在则复用）
            docker start it-mongo >/dev/null 2>&1 || \
              docker run -d --name it-mongo -p 27018:27017 mongo:7
            cd ~/atlas-game-layout
            go test -count=1 ./test/e2e/
